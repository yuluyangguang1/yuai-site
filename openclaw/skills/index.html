.label{font-family:var(--sans);font-size:.9375rem;letter-spacing:.1875rem;text-transform:uppercase}

@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.blink{display:inline-block;width:1ch;height:1.1em;background:currentColor;vertical-align:text-bottom;animation:blink 1.2s step-end infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.fade-up.d1{animation-delay:.05s}.fade-up.d2{animation-delay:.18s}.fade-up.d3{animation-delay:.32s}
@media(prefers-reduced-motion:reduce){.blink{animation:none;opacity:1}.fade-up{animation:none;opacity:1;transform:none}}

.theme-toggle{background:none;border:none;cursor:pointer;color:var(--mid);opacity:.5;padding:8px;line-height:0;transition:opacity .2s;display:flex;align-items:center;border-radius:4px}
.theme-toggle:hover,.theme-toggle:focus-visible{opacity:1;outline:1px solid var(--border)}
.theme-toggle svg{display:block}

.page{position:relative;z-index:200;max-width:1100px;margin:0 auto;padding:0;overflow-x:hidden}
.row{display:grid;grid-template-columns:1fr;border-top:1px solid var(--border);border-left:1px solid var(--border)}

.nav-link .blink{display:none}
.nav-link:hover .blink,.nav-link:focus-visible .blink{display:inline-block}

.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;padding:64px 20px 48px;width:100%}

/* Category tabs */
.cats{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.cat{padding:8px 16px;border:1px solid var(--border);font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;cursor:pointer;background:none;color:inherit;transition:all .2s}

/* Search */
.search-row{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.search-box{flex:1;padding:8px 12px;background:transparent;border:1px solid var(--border);color:inherit;font:inherit;font-family:var(--mono);font-size:.82rem}
.search-box:focus{outline:none;border-color:var(--accent)}

/* Skills grid */
.skills-grid{display:grid;grid-template-columns:1fr;border-top:1px solid var(--border);border-left:1px solid var(--border);border-right:1px solid var(--border)}
@media(min-width:640px){.skills-grid{grid-template-columns:1fr 1fr}}

.skill-card{padding:20px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px;transition:background .2s}
.skill-card:hover{background:var(--hover-fill)}
.skill-name{font-family:var(--serif);font-size:1.05rem;font-weight:600}
.skill-summary{font-size:.88rem;line-height:1.6;opacity:.7;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.skill-meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;opacity:.5;margin-top:4px}
.skill-install{display:flex;align-items:center;gap:6px;margin-top:8px}
.skill-install code{font-family:var(--mono);font-size:.72rem;background:var(--code-bg);border:1px solid var(--border);padding:4px 8px;border-radius:3px;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.state{padding:60px 20px;text-align:center;border:1px solid var(--border);border-top:none;opacity:.6}

/* Stats bar */

.stats-bar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}

/* Load more */
.load-more{display:flex;align-items:center;justify-content:center;padding:20px;border:1px solid var(--border);border-top:none;cursor:pointer;opacity:.6;transition:opacity .2s;font-family:var(--mono);font-size:.78rem;letter-spacing:.1em}

/* Footer */
.footer{display:grid;grid-template-columns:1fr;border:1px solid var(--border);margin-top:40px}
.footer .c{padding:16px;border-right:1px solid var(--border);display:flex;align-items:center}

  .cats,.search-row,.skills-grid,.state,.stats-bar,.load-more{border-left:none;border-right:none}
  .footer{grid-template-columns:1fr;border-left:none;border-right:none}
  .footer .c{border-right:none;border-bottom:1px solid var(--border)}
}
@media(max-width:640px){.display{font-size:2.2rem}.hero{padding:50px 16px}}
</style>

<script>
(function(){
'use strict';

// Theme toggle
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
var btn=document.getElementById('theme-btn');
if(btn){
  var html=document.documentElement,sun=btn.querySelector('.theme-sun'),moon=btn.querySelector('.theme-moon');
  function syncIcons(L){sun.style.display=L?'none':'block';moon.style.display=L?'block':'none'}
  var saved=lsGet('yuai-theme');
  if(saved==='light'){html.setAttribute('data-theme','light');syncIcons(true)}
  else if(saved==='dark'){html.setAttribute('data-theme','dark');syncIcons(false)}
  else{var mql=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');syncIcons(mql&&mql.matches)}
  btn.onclick=function(){
    var L=html.getAttribute('data-theme')!=='light';
    if(!html.getAttribute('data-theme')){var sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;L=!sys}
    html.setAttribute('data-theme',L?'light':'dark');lsSet('yuai-theme',L?'light':'dark');syncIcons(L)
  }
}
var fy=document.getElementById('footer-year');
if(fy)fy.textContent='mit · '+new Date().getFullYear();

// Categories with search keywords
var CATEGORIES=[
  {id:'all',label:'全部',query:''},
  {id:'dev',label:'开发者',query:'coding'},
  {id:'frontend',label:'前端',query:'frontend'},
  {id:'backend',label:'后端',query:'backend'},
  {id:'mobile',label:'移动端',query:'mobile'},
  {id:'devops',label:'运维/DevOps',query:'devops'},
  {id:'security',label:'安全',query:'security'},
  {id:'data',label:'数据分析',query:'data'},
  {id:'ai-ml',label:'AI/机器学习',query:'machine learning'},
  {id:'design',label:'设计师',query:'design'},
  {id:'writing',label:'写作/编辑',query:'writing'},
  {id:'marketing',label:'营销/运营',query:'marketing'},
  {id:'pm',label:'产品经理',query:'product'},
  {id:'finance',label:'财务/金融',query:'finance'},
  {id:'legal',label:'法律',query:'legal'},
  {id:'hr',label:'人力资源',query:'recruiting'},
  {id:'education',label:'教育/培训',query:'teaching'},
  {id:'academic',label:'学术/科研',query:'research'},
  {id:'medical',label:'医疗/健康',query:'medical'},
  {id:'sales',label:'销售',query:'sales'},
  {id:'support',label:'客服/支持',query:'support'},
  {id:'translation',label:'翻译',query:'translate'},
  {id:'general',label:'通用工具',query:'automation'}
];

var API_BASE='https://clawhub.ai/api/v1';
var PAGE_SIZE=30;
var currentCat='all';
var currentSearch='';
var currentPage=0;
var allItems=[];
var loading=false;
var hasMore=true;

// Render category tabs
var catsEl=document.getElementById('cats');
CATEGORIES.forEach(function(c){
  var b=document.createElement('button');
  b.className='cat'+(c.id==='all'?' active':'');
  b.textContent=c.label;
  b.dataset.cat=c.id;
  b.onclick=function(){
    document.querySelectorAll('.cat').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    currentCat=c.id;
    currentPage=0;allItems=[];hasMore=true;
    fetchSkills()
  };
  catsEl.appendChild(b)
});

// Search
var sb=document.getElementById('searchBox');
var searchTimer;
sb.addEventListener('input',function(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    currentSearch=sb.value.trim();
    currentPage=0;allItems=[];hasMore=true;
    fetchSkills()
  },300)
});

function getQuery(){
  var cat=CATEGORIES.find(function(c){return c.id===currentCat});
  var q=(cat&&cat.query?cat.query:'');
  if(currentSearch)q=(q+' '+currentSearch).trim();
  return q
}

async function fetchSkills(){
  if(loading)return;
  loading=true;
  var grid=document.getElementById('skillsGrid');
  var state=document.getElementById('loadingState');
  var more=document.getElementById('loadMore');
  if(currentPage===0){grid.innerHTML='';state.style.display='block';state.textContent='正在加载...';state.classList.remove('error')}

  var q=getQuery();
  var url;
  if(q){
    url=API_BASE+'/search?q='+encodeURIComponent(q)+'&limit='+PAGE_SIZE+'&offset='+(currentPage*PAGE_SIZE)
  }else{
    url=API_BASE+'/skills?limit='+PAGE_SIZE+'&offset='+(currentPage*PAGE_SIZE)
  }

  try{
    var r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var data=await r.json();
    var items=data.items||data.results||[];
    if(items.length<PAGE_SIZE)hasMore=false;
    allItems=allItems.concat(items);
    renderGrid();
    state.style.display='none';
    more.style.display=hasMore?'flex':'none';
    document.getElementById('syncStatus').textContent='已同步 ClawHub';
    document.getElementById('totalCount').textContent='显示 '+allItems.length+' 个技能'
  }catch(err){
    state.textContent='加载失败: '+err.message;
    state.classList.add('error');
    state.style.display='block';
    document.getElementById('syncStatus').textContent='同步失败'
  }
  loading=false
}

function renderGrid(){
  var grid=document.getElementById('skillsGrid');
  grid.innerHTML=allItems.map(function(s){
    var slug=s.slug||'';
    var name=s.displayName||slug;
    var summary=s.summary||'';
    var ver=s.latestVersion?s.latestVersion.version:(s.version||'');
    var stars=(s.stats&&s.stats.stars)||0;
    var installs=(s.stats&&(s.stats.installsAllTime||s.stats.downloads))||0;
    var cmd='clawhub install '+slug;
    return '<div class="skill-card">'+
      '<div class="skill-name">'+escHtml(name)+'</div>'+
      '<div class="skill-summary">'+escHtml(summary)+'</div>'+
      '<div class="skill-meta">'+
        (ver?'<span>v'+escHtml(ver)+'</span>':'')+
        (stars?'<span>'+stars+' 星</span>':'')+
        (installs?'<span>'+installs+' 安装</span>':'')+
      '</div>'+
      '<div class="skill-install">'+
        '<code>'+escHtml(cmd)+'</code>'+
        '<button onclick="copyCmd(this,\''+escAttr(cmd)+'\')">复制</button>'+
      '</div>'+
    '</div>'
  }).join('')
}

window.loadNextPage=function(){
  currentPage++;
  fetchSkills()
};

window.copyCmd=function(btn,cmd){
  navigator.clipboard.writeText(cmd).then(function(){
    btn.textContent='已复制';
    setTimeout(function(){btn.textContent='复制'},1500)
  }).catch(function(){
    btn.textContent='失败';
    setTimeout(function(){btn.textContent='复制'},1500)
  })
};

function escHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function escAttr(s){return escHtml(s).replace(/\\/g,'\\\\')}

// Boot
fetchSkills()

})();
</script>

<script>
(function(){
  // Theme toggle
  try{
    var btn=document.getElementById('theme-btn');
    if(btn){
      var root=document.documentElement,sun=btn.querySelector('.theme-sun'),moon=btn.querySelector('.theme-moon');
      function sync(i){if(sun)sun.style.display=i?'none':'block';if(moon)moon.style.display=i?'block':'none'}
      var sv;try{sv=localStorage.getItem('yuai-theme')}catch(_){}
      if(sv==='light'){root.setAttribute('data-theme','light');sync(true)}
      else if(sv==='dark'){root.setAttribute('data-theme','dark');sync(false)}
      else{var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)');sync(m&&m.matches)}
      btn.onclick=function(){
        var n=root.getAttribute('data-theme')!=='light';
        if(!root.getAttribute('data-theme')){n=!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches)}
        root.setAttribute('data-theme',n?'light':'dark');try{localStorage.setItem('yuai-theme',n?'light':'dark')}catch(_){}sync(n);
      };
    }
  }catch(_){}
  // Footer year
  try{var fy=document.getElementById('footer-year');if(fy)fy.textContent='mit · '+new Date().getFullYear()}catch(_){}
})();
</script>
