<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>富婆的联系方式 - 燕城物语</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--card:#1a1a2e;--accent:#e94560;--gold:#ffd700;
  --text:#eee;--dim:#888;--success:#4ade80;--info:#60a5fa;
  --card2:#16213e;--card3:#0f3460;
  --glass:rgba(26,26,46,0.85);
  --font:'LXGW WenKai TC','LXGW WenKai','PingFang SC','Microsoft YaHei',serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .4s}
.screen.active{display:flex;opacity:1;z-index:10}
.screen.entering{display:flex;animation:fadeIn .4s forwards}
.screen.leaving{animation:fadeOut .4s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--accent)}50%{box-shadow:0 0 20px var(--accent),0 0 40px rgba(233,69,96,0.3)}}
@keyframes typing{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-family:var(--font);font-size:15px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(233,69,96,0.4)}
.btn:active{transform:translateY(0)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1a2e}
.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.small{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(233,69,96,0.3);border-radius:2px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:8px;border:1px solid rgba(233,69,96,0.1);transition:all .2s}
.card:hover{border-color:rgba(233,69,96,0.3);transform:translateY(-1px)}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.badge.gold{background:var(--gold);color:#1a1a2e}
.badge.info{background:var(--info)}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700}
.avatar.sm{width:36px;height:36px;font-size:14px}
.avatar.lg{width:80px;height:80px;font-size:32px}
.bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;transition:width .5s}
.hbar{display:flex;align-items:center;gap:8px;padding:4px 0}
.hbar label{font-size:12px;color:var(--dim);min-width:60px}
.hbar .bar{flex:1}
.tag{display:inline-block;background:rgba(233,69,96,0.15);color:var(--accent);font-size:12px;padding:3px 10px;border-radius:12px;margin:2px}
.tooltip{position:relative}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.tooltip:hover::after{opacity:1}
.notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:12px 24px;border-radius:12px;z-index:9999;animation:slideDown .3s;font-size:14px;max-width:90vw;text-align:center}
.notification.hiding{animation:slideUp .3s reverse forwards}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--card);border-radius:16px;padding:24px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid rgba(233,69,96,0.2)}
.modal h3{color:var(--accent);margin-bottom:12px;font-size:18px}
.input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:80px}
select.input{cursor:pointer}

/* Title Screen */
#title-screen{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(233,69,96,0.15),transparent 70%)}
#title-screen .logo{font-size:clamp(32px,8vw,56px);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s infinite}
#title-screen .subtitle{color:var(--dim);font-size:16px;margin:12px 0 40px}
#title-screen .menu-btns{display:flex;flex-direction:column;gap:12px;width:260px}
#title-screen .menu-btns .btn{width:100%;justify-content:center;padding:14px;font-size:16px}
#title-screen .version{position:absolute;bottom:20px;color:var(--dim);font-size:12px}

/* Character Select */
#char-select{padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(233,69,96,0.08),transparent 60%)}
#char-select h2{text-align:center;margin-bottom:4px;color:var(--accent);font-size:22px}
#char-select .desc{text-align:center;color:var(--dim);margin-bottom:16px;font-size:13px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:8px}
.char-card{background:var(--card);border-radius:14px;padding:16px;cursor:pointer;border:2px solid transparent;transition:all .3s;position:relative;overflow:hidden}
.char-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));opacity:0;transition:opacity .3s}
.char-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.char-card:hover::before{opacity:1}
.char-card.selected{border-color:var(--accent);box-shadow:0 0 20px rgba(233,69,96,0.3)}
.char-card.selected::before{opacity:1}
.char-card .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.char-card .name{font-size:18px;font-weight:700}
.char-card .age{color:var(--dim);font-size:13px}
.char-card .role{color:var(--gold);font-size:13px}
.char-card .bio{color:var(--dim);font-size:13px;line-height:1.5}
.char-card .skills{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

/* Main Hub */
#main-hub{flex-direction:column}
#hub-header{background:var(--card);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(233,69,96,0.1);flex-shrink:0}
#hub-header .player-info{display:flex;align-items:center;gap:10px}
#hub-header .player-name{font-weight:700;font-size:16px}
#hub-header .player-role{font-size:12px;color:var(--gold)}
#hub-header .time-display{font-size:13px;color:var(--dim);text-align:right}
#hub-header .time-display .game-time{color:var(--accent);font-weight:700}
#hub-body{flex:1;display:flex;overflow:hidden}
#hub-nav{display:flex;flex-direction:column;background:var(--card);border-right:1px solid rgba(233,69,96,0.1);width:70px;flex-shrink:0;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:10px 4px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:10px;gap:4px;color:var(--dim)}
.nav-item:hover,.nav-item.active{color:var(--accent);background:rgba(233,69,96,0.05);border-left-color:var(--accent)}
.nav-item .icon{font-size:22px}
#hub-content{flex:1;overflow-y:auto;padding:0}

/* Phone Screen */
.phone-frame{max-width:380px;margin:0 auto;background:var(--bg);border-radius:30px;padding:12px;height:100%;display:flex;flex-direction:column;border:2px solid #333}
.phone-notch{height:24px;background:var(--bg);border-radius:0 0 12px 12px;margin:-12px -12px 8px;display:flex;align-items:center;justify-content:center}
.phone-notch span{width:60px;height:6px;background:#333;border-radius:3px}
.phone-screen{flex:1;background:var(--bg);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.chat-header{background:var(--card);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(233,69,96,0.1);flex-shrink:0}
.chat-header .back-btn{cursor:pointer;font-size:20px;padding:4px}
.chat-header .contact-name{font-weight:700;font-size:16px;flex:1}
.chat-header .status{font-size:11px;color:var(--success)}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeIn .3s;word-break:break-word}
.msg.them{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg .time{font-size:10px;color:var(--dim);margin-top:4px}
.msg.me .time{color:rgba(255,255,255,0.6)}
.msg.system{text-align:center;font-size:12px;color:var(--dim);align-self:center;background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:10px}
.typing-indicator{display:flex;gap:4px;padding:10px 14px;background:var(--card);border-radius:16px;align-self:flex-start;border-bottom-left-radius:4px;max-width:78%}
.typing-indicator span{width:8px;height:8px;background:var(--dim);border-radius:50%;animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
.chat-input-area{display:flex;gap:8px;padding:10px;background:var(--card);border-top:1px solid rgba(233,69,96,0.1);flex-shrink:0}
.chat-input-area input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:8px 16px;color:var(--text);font-family:var(--font);font-size:14px;outline:none}
.chat-input-area input:focus{border-color:var(--accent)}
.chat-input-area button{background:var(--accent);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0}
.msg-options{display:flex;flex-direction:column;gap:6px;padding:8px;flex-shrink:0}
.msg-option{background:var(--card);border:1px solid rgba(233,69,96,0.2);color:var(--text);padding:10px 16px;border-radius:12px;cursor:pointer;font-family:var(--font);font-size:14px;text-align:left;transition:all .2s}
.msg-option:hover{border-color:var(--accent);background:rgba(233,69,96,0.1)}

/* WeChat List */
.wechat-list{padding:0}
.wechat-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:background .2s;position:relative}
.wechat-item:hover{background:rgba(233,69,96,0.05)}
.wechat-item .unread{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.wechat-item .last-msg{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.wechat-item .info{flex:1;min-width:0}
.wechat-item .name-row{display:flex;justify-content:space-between;align-items:center}
.wechat-item .msg-time{font-size:11px;color:var(--dim)}

/* Moments (朋友圈) */
.moments{padding:12px}
.moment-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.moment-card .header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.moment-card .content{font-size:14px;line-height:1.6;margin-bottom:10px}
.moment-card .images{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
.moment-card .img{aspect-ratio:1;background:rgba(233,69,96,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px}
.moment-card .actions{display:flex;gap:20px;font-size:13px;color:var(--dim)}
.moment-card .actions span{cursor:pointer}
.moment-card .actions span:hover{color:var(--accent)}
.moment-card .comments{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05)}
.moment-card .comment{font-size:13px;padding:4px 0}
.moment-card .comment b{color:var(--accent);margin-right:4px}

/* City Map */
.city-map{padding:16px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.map-location{background:var(--card);border-radius:12px;padding:14px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .3s}
.map-location:hover{border-color:var(--accent);transform:translateY(-3px)}
.map-location.locked{opacity:0.4;cursor:not-allowed}
.map-location .loc-icon{font-size:32px;margin-bottom:8px}
.map-location .loc-name{font-weight:700;font-size:14px}
.map-location .loc-desc{font-size:11px;color:var(--dim);margin-top:4px}
.map-location .loc-time{font-size:11px;color:var(--gold);margin-top:4px}

/* Story View */
.story-view{display:flex;flex-direction:column;height:100%}
.story-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(233,69,96,0.05),rgba(26,26,46,0.95));z-index:0}
.story-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:20px;max-width:600px;margin:0 auto;width:100%}
.story-char-name{color:var(--accent);font-size:16px;font-weight:700;margin-bottom:4px}
.story-text{font-size:16px;line-height:1.8;padding:16px;background:rgba(0,0,0,0.3);border-radius:12px;backdrop-filter:blur(10px);margin-bottom:16px;animation:fadeIn .5s}
.story-choices{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.story-choice{background:var(--card);border:1px solid rgba(233,69,96,0.2);color:var(--text);padding:14px 20px;border-radius:12px;cursor:pointer;font-family:var(--font);font-size:15px;text-align:left;transition:all .3s;position:relative;overflow:hidden}
.story-choice::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transition:transform .3s}
.story-choice:hover{border-color:var(--accent);background:rgba(233,69,96,0.1);transform:translateX(4px)}
.story-choice:hover::before{transform:scaleY(1)}
.story-choice .effect{font-size:11px;color:var(--gold);margin-top:4px}
.story-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.story-header .back{cursor:pointer;font-size:20px;padding:4px 8px}
.story-header .title{color:var(--accent);font-size:16px;font-weight:700}

/* Investigation */
.invest-board{padding:16px}
.clue-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border-left:3px solid var(--gold);transition:all .2s}
.clue-card.locked{border-left-color:var(--dim);opacity:0.5}
.clue-card .clue-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.clue-card .clue-desc{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
.clue-card .clue-source{font-size:11px;color:var(--info);margin-top:4px}
.invest-progress{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
.invest-progress h3{color:var(--accent);margin-bottom:8px}

/* Relationship */
.rel-view{padding:16px}
.rel-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;transition:all .2s}
.rel-card:hover{transform:translateY(-2px)}
.rel-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rel-name{font-size:17px;font-weight:700;flex:1}
.rel-title{font-size:12px;color:var(--gold)}
.rel-bars{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.rel-info{display:flex;gap:8px;flex-wrap:wrap}
.rel-secret{font-size:12px;color:var(--accent);background:rgba(233,69,96,0.1);padding:4px 10px;border-radius:8px;margin-top:4px}

/* Achievements */
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:16px}
.ach-card{background:var(--card);border-radius:12px;padding:14px;text-align:center;border:1px solid transparent;transition:all .3s}
.ach-card.unlocked{border-color:var(--gold)}
.ach-card.locked{opacity:0.4}
.ach-card .ach-icon{font-size:36px;margin-bottom:8px}
.ach-card .ach-name{font-weight:700;font-size:14px}
.ach-card .ach-desc{font-size:12px;color:var(--dim);margin-top:4px}
.ach-card .ach-date{font-size:10px;color:var(--gold);margin-top:4px}

/* Save/Load */
.save-slots{padding:16px}
.save-slot{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.save-slot:hover{border-color:var(--accent)}
.save-slot .slot-num{background:var(--accent);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.save-slot .slot-info{flex:1}
.save-slot .slot-name{font-weight:700}
.save-slot .slot-detail{font-size:12px;color:var(--dim)}
.save-slot .slot-time{font-size:11px;color:var(--gold)}

/* Settings */
.settings{padding:20px;max-width:500px;margin:0 auto}
.setting-group{margin-bottom:20px}
.setting-group h3{color:var(--accent);margin-bottom:8px;font-size:15px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.toggle{width:44px;height:24px;background:rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;position:relative;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:22px}

/* Relationship Web SVG */
.rel-web-container{padding:16px}
.rel-web-container svg{width:100%;height:auto}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;z-index:9999;animation:confetti 3s ease-in forwards;pointer-events:none}

/* Responsive */
@media(max-width:768px){
  #hub-nav{width:56px}
  #hub-nav .nav-item span:not(.icon){display:none}
  .char-grid{grid-template-columns:1fr}
  .map-grid{grid-template-columns:repeat(2,1fr)}
  .phone-frame{border-radius:0;max-width:100%;padding:0}
  .phone-notch{display:none}
}
@media(max-width:480px){
  .map-grid{grid-template-columns:repeat(2,1fr)}
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Title Screen -->
  <div id="title-screen" role="main" aria-label="游戏标题" role="main" aria-label="游戏标题" class="screen active">
    <div class="logo">富婆的联系方式</div>
    <div class="subtitle">燕城物语 · 每个人都有秘密</div>
    <div class="menu-btns">
      <button class="btn gold" onclick="G.newGame()" tabindex="0" tabindex="0">✨ 新游戏</button>
      <button class="btn" onclick="G.continueGame()" tabindex="0" tabindex="0" id="continue-btn" style="display:none">📖 继续游戏</button>
      <button class="btn ghost" onclick="G.showScreen" tabindex="0"" tabindex="0"('settings-screen')">⚙️ 设置</button>
    </div>
    <div class="version">v1.0 · 燕城互动小说</div>
  </div>

  <!-- Character Select -->
  <div id="char-select" role="main" aria-label="角色选择" role="main" aria-label="角色选择" class="screen">
    <h2>选择你的身份</h2>
    <p class="desc">每个身份都有独特的视角和故事线</p>
    <div class="scroll">

// ===================== GAME ENGINE =====================
const G = {
  state: null,
  currentScreen: 'title-screen',
  history: [],

  init() {
    this.loadState();
    if (this.state && this.state.player) {
      document.getElementById('continue-btn').style.display = '';
    }
    this.renderTitle();
  },

  newGame() {
    this.state = {
      player: null,
      chapter: {luyuan:0,linxiaoyu:0,chenmo:0,suya:0,zhouzixuan:0},
      relationships: {},
      clues: [],
      achievements: [],
      messages: {},
      time: {day:1, hour:8, period:'morning'},
      storyFlags: {},
      unread: {}
    };
    // Init relationships
    Object.keys(GAME_DATA.richWomen).forEach(k => {
      this.state.relationships[k] = {affection:0, trust:0, secret:0, met:false};
    });
    this.showScreen('char-select');
    this.renderCharSelect();
  },

  continueGame() {
    if (this.state && this.state.player) {
      this.showScreen('main-hub');
      this.renderHub();
    }
  },

  loadState() {
    try {
      const s = localStorage.getItem('fupo_save');
      if (s) this.state = JSON.parse(s);
    } catch(e) {}
  },

  saveState() {
    try {
      localStorage.setItem('fupo_save', JSON.stringify(this.state));
    } catch(e) {}
  },

  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => {
      s.classList.remove('active','entering');
    });
    const el = document.getElementById(id);
    el.classList.add('active','entering');
    this.currentScreen = id;
    setTimeout(() => el.classList.remove('entering'), 400);
  },

  goBack() {
    if (this.state && this.state.player) {
      this.showScreen('main-hub');
    } else {
      this.showScreen('title-screen');
    }
  },

  notify(msg) {
    const n = document.createElement('div');
    n.className = 'notification';
    n.textContent = msg;
    document.body.appendChild(n);
    setTimeout(() => { n.classList.add('hiding'); setTimeout(() => n.remove(), 300); }, 2500);
  },

  // ===== Character Select =====
  renderCharSelect() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    Object.values(GAME_DATA.players).forEach(p => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.dataset.id = p.id;
      card.innerHTML = `
        <div class="top">
          <div class="avatar" style="background:${p.color}">${p.avatar}</div>
          <div>
            <div class="name">${p.name}</div>
            <div><span class="age">${p.age}岁</span> · <span class="role">${p.role}</span></div>
          </div>
        </div>
        <div class="bio">${p.bio}</div>
        <div class="skills">${p.skills.map(s => `<span class="tag">${s}</span>`).join('')}</div>
      `;
      card.onclick = () => {
        grid.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('confirm-char-btn').disabled = false;
        this._selectedChar = p.id;
      };
      grid.appendChild(card);
    });
  },

  confirmCharacter() {
    if (!this._selectedChar) return;
    this.state.player = this._selectedChar;
    this.saveState();
    // Show intro
    const p = GAME_DATA.players[this._selectedChar];
    this.showIntro(p);
  },

  showIntro(player) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = 200;
    overlay.innerHTML = `
      <div class="modal" style="max-width:500px">
        <h3>${player.avatar} ${player.name}的故事</h3>
        <div style="font-size:14px;line-height:1.8;color:var(--dim);max-height:50vh;overflow-y:auto">${player.intro.split('\n').map(p => `<p style="margin-bottom:8px">${p}</p>`).join('')}</div>
        <div style="margin-top:16px;text-align:center">
          <button class="btn gold" onclick="this.closest('.modal-overlay').remove();G.startGame()">开始旅程</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  },

  startGame() {
    this.showScreen('main-hub');
    this.renderHub();
    this.advanceTime(0);
    // Unlock first story
    this.unlockChapter(this.state.player, 1);
    this.notify('欢迎来到燕城，' + GAME_DATA.players[this.state.player].name);
  },

  // ===== Hub Rendering =====
  renderHub() {
    const p = GAME_DATA.players[this.state.player];
    document.getElementById('hub-avatar').textContent = p.avatar;
    document.getElementById('hub-avatar').style.background = p.color;
    document.getElementById('hub-player-name').textContent = p.name;
    document.getElementById('hub-player-role').textContent = p.role + ' · ' + p.age + '岁';
    this.switchTab('map');
  },

  switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
    const content = document.getElementById('hub-content');
    content.scrollTop = 0;
    switch(tab) {
      case 'map': this.renderMap(content); break;
      case 'phone': this.renderPhone(content); break;
      case 'stories': this.renderStories(content); break;
      case 'invest': this.renderInvestigation(content); break;
      case 'relations': this.renderRelationships(content); break;
      case 'achievements': this.renderAchievements(content); break;
      case 'save': this.renderSaveLoad(content); break;
    }
  },

  // ===== Map =====
  renderMap(el) {
    const locs = GAME_DATA.locations;
    const p = GAME_DATA.players[this.state.player];
    let html = '<div class="city-map"><h3 style="color:var(--accent);margin-bottom:12px">🗺️ 燕城地图</h3><div class="map-grid">';
    Object.entries(locs).forEach(([key, loc]) => {
      const isHome = key === p.startLocation;
      html += `
        <div class="map-location" onclick="G.visitLocation('${key}')" ${isHome ? 'style="border-color:var(--gold)"' : ''}>
          <div class="loc-icon">${loc.icon}</div>
          <div class="loc-name">${loc.name}</div>
          <div class="loc-desc">${loc.desc}</div>
          <div class="loc-time">🕐 ${loc.time}</div>
          ${isHome ? '<div class="badge gold" style="margin-top:4px">🏠 据点</div>' : ''}
        </div>
      `;
    });
    html += '</div></div>';
    el.innerHTML = html;
  },

  visitLocation(loc) {
    const locData = GAME_DATA.locations[loc];
    // Check for events based on location and time
    const events = this.getLocationEvents(loc);
    if (events.length > 0) {
      this.triggerEvent(events[0]);
    } else {
      this.notify(`你来到了${locData.name}，这里似乎没什么特别的事情发生。`);
      this.advanceTime(1);
    }
  },

  getLocationEvents(loc) {
    const events = [];
    const p = this.state.player;
    const ch = this.state.chapter[p];
    // Character-specific location events
    if (p === 'luyuan' && loc === 'office' && ch >= 1) {
      events.push({type:'story', id:'luyuan_ch' + (ch+1)});
    }
    if (p === 'chenmo' && loc === 'club' && ch >= 1) {
      events.push({type:'story', id:'chenmo_ch' + (ch+1)});
    }
    if (p === 'zhouzixuan' && loc === 'nightclub') {
      events.push({type:'story', id:'zhouzixuan_ch2'});
    }
    return events;
  },

  triggerEvent(event) {
    if (event.type === 'story') {
      this.startStory(event.id);
    }
  },

  // ===== Phone =====
  renderPhone(el) {
    const p = GAME_DATA.players[this.state.player];
    const contacts = p.contacts;
    let html = '<div class="phone-frame"><div class="phone-notch"><span></span></div><div class="phone-screen">';
    html += '<div class="chat-header"><span style="font-size:20px">📱</span><span class="contact-name" style="flex:1;text-align:center">微信</span></div>';
    html += '<div class="wechat-list scroll">';
    contacts.forEach(cid => {
      const c = GAME_DATA.richWomen[cid];
      const msgs = this.state.messages[cid] || [];
      const lastMsg = msgs.length > 0 ? msgs[msgs.length-1].text : '点击开始对话';
      const unread = this.state.unread[cid] || 0;
      html += `
        <div class="wechat-item" onclick="G.openChat('${cid}')">
          <div class="avatar" style="background:${c.color}">${c.avatar}</div>
          <div class="info">
            <div class="name-row"><span style="font-weight:700">${c.name}</span><span class="msg-time">${this.getTimeStr()}</span></div>
            <div class="last-msg">${lastMsg}</div>
          </div>
          ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
        </div>
      `;
    });
    // Also show other players as contacts
    Object.values(GAME_DATA.players).forEach(op => {
      if (op.id === p.id) return;
      html += `
        <div class="wechat-item" onclick="G.openChat('${op.id}')">
          <div class="avatar" style="background:${op.color}">${op.avatar}</div>
          <div class="info">
            <div class="name-row"><span style="font-weight:700">${op.name}</span><span class="msg-time">${this.getTimeStr()}</span></div>
            <div class="last-msg">${op.role}</div>
          </div>
        </div>
      `;
    });
    html += '</div></div></div>';
    el.innerHTML = html;
  },

  openChat(contactId) {
    const content = document.getElementById('hub-content');
    const isRichWoman = GAME_DATA.richWomen[contactId];
    const contact = isRichWoman ? GAME_DATA.richWomen[contactId] : GAME_DATA.players[contactId];
    const msgs = this.state.messages[contactId] || [];
    this.state.unread[contactId] = 0;

    let html = '<div class="phone-frame"><div class="phone-notch"><span></span></div><div class="phone-screen">';
    html += `<div class="chat-header">
      <span class="back-btn" onclick="G.switchTab('phone')">←</span>
      <div class="avatar sm" style="background:${contact.color}">${contact.avatar}</div>
      <div class="contact-name">${contact.name}</div>
      ${isRichWoman ? `<span class="status">在线</span>` : ''}
    </div>`;
    html += '<div class="chat-messages scroll" id="chat-messages">';
    if (msgs.length === 0) {
      html += '<div class="msg system">你开始了一段新对话</div>';
    }
    msgs.forEach(m => {
      html += `<div class="msg ${m.from === 'me' ? 'me' : 'them'}"><div>${m.text}</div><div class="time">${m.time || this.getTimeStr()}</div></div>`;
    });
    html += '</div>';
    // Options or input
    if (isRichWoman && msgs.length === 0) {
      // Show conversation starters
      const starters = this.getChatStarters(contactId);
      html += '<div class="msg-options">';
      starters.forEach(s => {
        html += `<div class="msg-option" onclick="G.sendFirstMsg('${contactId}','${s.text}')">${s.text}</div>`;
      });
      html += '</div>';
    } else if (isRichWoman) {
      html += `<div class="msg-options" id="chat-opts"></div>`;
      html += `<div class="chat-input-area"><input type="text" id="chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')G.sendMsg('${contactId}')"><button onclick="G.sendMsg('${contactId}')">➤</button></div>`;
    } else {
      html += `<div class="chat-input-area"><input type="text" id="chat-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')G.sendMsg('${contactId}')"><button onclick="G.sendMsg('${contactId}')">➤</button></div>`;
    }
    html += '</div></div>';
    content.innerHTML = html;

    // Scroll to bottom
    setTimeout(() => {
      const chatBox = document.getElementById('chat-messages');
      if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
    }, 50);

    // Unlock achievement
    if (!this.state.achievements.includes('first_chat')) {
      this.unlockAchievement('first_chat');
    }
    // Mark as met
    if (isRichWoman && !this.state.relationships[contactId].met) {
      this.state.relationships[contactId].met = true;
      this.state.relationships[contactId].affection += 5;

  showTypingReply(cid, userMsg) {
    const chatBox = document.getElementById('chat-messages');
    if (!chatBox) return;
    // Show typing indicator
    const typing = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chatBox.appendChild(typing);
    chatBox.scrollTop = chatBox.scrollHeight;

  generateReply(cid, userMsg) {
    const msg = (userMsg || '').toLowerCase();
    const chatData = STORIES[this.state.player]?.['chat_' + cid];
    if (chatData) {
      for (const rule of chatData.default) {
        if (rule.trigger === 'default') continue;
        if (msg.includes(rule.trigger)) {
          return rule.responses[Math.floor(Math.random() * rule.responses.length)];
        }
      }
      // Default responses
      const defaults = chatData.default.find(r => r.trigger === 'default');
      if (defaults) {
        return defaults.responses[Math.floor(Math.random() * defaults.responses.length)];
      }
    }
    // Generic replies
    const genericReplies = [
      '嗯，我知道了。',
      '好的，有空再聊~',
      '你说的有道理。',
      '这件事...我需要想想。',
      '你很有趣呢。',
      '改天见面聊吧。',
      '我正在忙，晚点回你。',
      '你为什么会问这个？',
      '嗯...',
      '我考虑一下。'
    ];
    return genericReplies[Math.floor(Math.random() * genericReplies.length)];
  },

    };

  startStory(storyId) {
    // Normalize story ID
    let id = storyId;
    if (!id.includes('_ch') && !id.includes('_')) {
      id = this.state.player + '_1';
    }
    // Try to find the story
    const playerStories = STORIES[this.state.player];
    if (!playerStories) return;

    let story = playerStories[id];
    if (!story) {
      // Try mapping
      const parts = id.split('_');
      if (parts.length >= 2) {
        const chapterNum = parts[parts.length - 1];
        story = playerStories[parts[0] + '_' + chapterNum];
      }
    }
    if (!story) {
      // Try direct chapter
      const p = this.state.player;
      const chNum = parseInt(id.replace(p + '_', ''));
      if (chNum && playerStories[chNum]) {
        story = playerStories[chNum];
      }
    }
    if (!story) {
      this.notify('这个故事还没有准备好...');
      return;
    }

    this._currentStory = story;
    this._storySceneIdx = 0;
    this.renderStoryScene();
  },

  renderStoryScene() {
    const story = this._currentStory;
    if (!story || !story.scenes) return;
    const scene = story.scenes[this._storySceneIdx];
    if (!scene) return;

    const content = document.getElementById('hub-content');
    let html = '<div class="story-view" style="padding:16px">';
    html += `<div class="story-header">
      <span class="back" onclick="G.switchTab('stories')">←</span>
      <span class="title">${story.title}</span>
      <span style="font-size:12px;color:var(--dim)">${this._storySceneIdx + 1}/${story.scenes.length}</span>
    </div>`;

    // Render all scenes up to current
    for (let i = 0; i <= this._storySceneIdx; i++) {
      const s = story.scenes[i];
      if (s.speaker === 'narration') {
        html += `<div class="story-text" style="color:var(--dim)">${s.text}</div>`;
      } else if (s.speaker === 'system') {
        html += `<div class="story-text" style="color:var(--gold);text-align:center;background:rgba(255,215,0,0.1)">${s.text}</div>`;
      } else {
        html += `<div class="story-char-name">${s.speaker}</div>`;
        html += `<div class="story-text">${s.text}</div>`;
      }
    }

    // Choices
    if (scene.choices) {
      html += '<div class="story-choices">';
      scene.choices.forEach((c, idx) => {
        html += `<div class="story-choice" onclick="G.makeChoice(${idx})">
          <div>${c.text}</div>
          ${c.effect ? `<div class="effect">✦ ${c.effect}</div>` : ''}
        </div>`;
      });
      html += '</div>';
    } else if (this._storySceneIdx < story.scenes.length - 1) {
      html += `<div style="text-align:center;padding:16px"><button class="btn" onclick="G.nextScene()">继续 ▶</button></div>`;
    } else {
      html += `<div style="text-align:center;padding:16px"><button class="btn gold" onclick="G.endStory()">章节结束</button></div>`;
    }

    html += '</div>';
    content.innerHTML = html;
    content.scrollTop = content.scrollHeight;
  },

  nextScene() {
    this._storySceneIdx++;
    this.renderStoryScene();
  },

  makeChoice(idx) {
    const scene = this._currentStory.scenes[this._storySceneIdx];
    const choice = scene.choices[idx];
    // Apply effects
    if (choice.effect) {
      if (choice.effect.includes('好感度')) {
        const match = choice.effect.match(/\+(\d+)/);
        // Apply to relevant character
      }
      if (choice.effect.includes('线索')) {
        // Add clue
        const clueId = this.inferClueId(choice.effect);
        if (clueId && !this.state.clues.includes(clueId)) {
          this.state.clues.push(clueId);
          this.unlockAchievement('first_clue');
          this.notify('🔍 获得新线索！');
        }
      }
    }
    // Handle endings
    if (choice.ending) {
      this.triggerEnding(choice.ending);
      return;
    }
    // Move to next scene or story
    if (choice.next) {
      // Try to load the next story branch
      const nextStory = STORIES[this.state.player]?.[choice.next] || STORIES[this.state.player]?.[this.state.player + '_' + choice.next];
      if (nextStory) {
        this._currentStory = nextStory;
        this._storySceneIdx = 0;
        this.renderStoryScene();
      } else {
        this._storySceneIdx++;
        if (this._storySceneIdx >= this._currentStory.scenes.length) {
          this.endStory();
        } else {
          this.renderStoryScene();
        }
      }
    } else {
      this._storySceneIdx++;
      if (this._storySceneIdx >= this._currentStory.scenes.length) {
        this.endStory();
      } else {
        this.renderStoryScene();
      }
    }
    this.saveState();
  },

  inferClueId(effect) {
    const map = {
      '债务记录':'debt_record',
      '大火照片':'fire_photo',
      '秘密会面':'secret_meeting',
      '酒吧录音':'club_recording',
      '咨询笔记':'therapy_notes',
      '信托基金':'trust_fund',
      '医院文件':'hospital_doc',
      '学术论文':'thesis_paper'
    };
    for (const [key, val] of Object.entries(map)) {
      if (effect.includes(key)) return val;
    }
    return null;
  },

  endStory() {
    const p = this.state.player;
    const ch = this.state.chapter[p];
    // Advance chapter
    this.state.chapter[p] = Math.min(ch + 1, 3);
    // Unlock achievements
    if (this.state.chapter[p] === 1) this.unlockAchievement('chapter1');
    if (this.state.chapter[p] === 2) this.unlockAchievement('chapter2');
    if (this.state.chapter[p] === 3) this.unlockAchievement('chapter3');
    this.advanceTime(2);
    this.saveState();
    this.switchTab('stories');
    this.notify('📖 章节完成！新内容已解锁。');
  },

              <div class="rel-title">${c.role} · ${c.age}岁</div>
            </div>
            ${rel.met ? '<span class="badge">已认识</span>' : '<span class="badge" style="background:var(--dim)">未认识</span>'}
          </div>
          <div class="rel-bars">
            <div class="hbar"><label>好感</label><div class="bar"><div class="fill" style="width:${Math.min(rel.affection,100)}%;background:var(--accent)"></div></div><span style="font-size:12px;min-width:30px;text-align:right">${rel.affection}</span></div>
            <div class="hbar"><label>信任</label><div class="bar"><div class="fill" style="width:${Math.min(rel.trust,100)}%;background:var(--info)"></div></div><span style="font-size:12px;min-width:30px;text-align:right">${rel.trust}</span></div>
            <div class="hbar"><label>秘密</label><div class="bar"><div class="fill" style="width:${Math.min(rel.secret,100)}%;background:var(--gold)"></div></div><span style="font-size:12px;min-width:30px;text-align:right">${rel.secret}</span></div>
          </div>
          <div class="rel-info">
            <span class="tag">${c.personality?.split('，')[0] || '未知'}</span>
            ${rel.affection >= 30 ? '<span class="tag" style="background:rgba(255,215,0,0.15);color:var(--gold)">亲密</span>' : ''}
            ${rel.trust >= 50 ? '<span class="tag" style="background:rgba(96,165,250,0.15);color:var(--info)">信任</span>' : ''}
          </div>
          ${rel.secret >= 30 ? `<div class="rel-secret">🗝️ 已发现部分秘密</div>` : ''}
        </div>
      `;
    });

    // Relationship web
    html += '<h3 style="color:var(--accent);margin:20px 0 8px">🕸️ 关系网络</h3>';
    html += '<div class="rel-web-container"><svg viewBox="0 0 400 350" id="rel-web"></svg></div>';

    html += '</div>';
    el.innerHTML = html;

    // Draw relationship web
    this.drawRelWeb();
  },

  drawRelWeb() {
    const svg = document.getElementById('rel-web');
    if (!svg) return;
    const nodes = [
      {id:'wangshihan',x:200,y:40,label:'王诗涵',color:'#e94560'},
      {id:'limengqi',x:100,y:100,label:'李梦琪',color:'#ec4899'},
      {id:'zhangyuxuan',x:300,y:100,label:'张雨萱',color:'#10b981'},
      {id:'liuqiqi',x:60,y:200,label:'刘思琪',color:'#8b5cf6'},
      {id:'zhaouxeting',x:340,y:200,label:'赵雪婷',color:'#06b6d4'},
      {id:'huangshiya',x:140,y:280,label:'黄诗雅',color:'#f43f5e'},
      {id:'zhoumeiling',x:260,y:280,label:'周美玲',color:'#d97706'},
      {id:'chenyuxin',x:200,y:180,label:'陈雨欣',color:'#7c3aed'}
    ];
    const edges = [
      ['wangshihan','limengqi','大学同学'],
      ['wangshihan','zhangyuxuan','商业对手'],
      ['liuqiqi','zhoumeiling','情报'],
      ['zhaouxeting','huangshiya','师生'],
      ['zhoumeiling','chenyuxin','咨询'],
      ['wangshihan','chenyuxin','咨询'],
      ['limengqi','chenyuxin','咨询'],
      ['liuqiqi','zhangyuxuan','秘密'],
      ['huangshiya','wangshihan','社交']
    ];

    let svgContent = '<defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';

    // Draw edges
    edges.forEach(([from, to, label]) => {
      const n1 = nodes.find(n => n.id === from);
      const n2 = nodes.find(n => n.id === to);
      if (n1 && n2) {
        svgContent += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x}" y2="${n2.y}" stroke="rgba(233,69,96,0.3)" stroke-width="1" stroke-dasharray="4,4"/>`;
        const mx = (n1.x + n2.x) / 2;
        const my = (n1.y + n2.y) / 2;
        svgContent += `<text x="${mx}" y="${my-6}" fill="rgba(255,255,255,0.3)" font-size="8" text-anchor="middle" font-family="var(--font)">${label}</text>`;
      }
    });

    // Draw nodes
    nodes.forEach(n => {
      const rel = this.state.relationships[n.id];
      const met = rel && rel.met;
      svgContent += `<circle cx="${n.x}" cy="${n.y}" r="${met ? 22 : 18}" fill="${met ? n.color : 'rgba(100,100,100,0.3)'}" filter="url(#glow)" opacity="${met ? 1 : 0.4}"/>`;
      svgContent += `<text x="${n.x}" y="${n.y+4}" fill="white" font-size="10" text-anchor="middle" font-family="var(--font)" font-weight="700">${n.label}</text>`;
    });

    // Player node
    const p = GAME_DATA.players[this.state.player];
    svgContent += `<circle cx="200" cy="340" r="24" fill="${p.color}" filter="url(#glow)"/>`;
    svgContent += `<text x="200" y="344" fill="white" font-size="10" text-anchor="middle" font-family="var(--font)" font-weight="700">${p.name}</text>`;

    svg.innerHTML = svgContent;
  },

  // ===== Achievements =====
  renderAchievements(el) {
    const achs = GAME_DATA.achievements;
    const unlocked = this.state.achievements;
    let html = '<div style="padding:16px"><h3 style="color:var(--accent);margin-bottom:4px">🏆 成就系统</h3>';
    html += `<p style="color:var(--dim);font-size:13px;margin-bottom:16px">已解锁: ${unlocked.length}/${achs.length}</p>`;
    html += '<div class="achievement-grid" style="padding:0">';
    achs.forEach(ach => {
      const isUnlocked = unlocked.includes(ach.id);
      html += `
        <div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
          <div class="ach-icon">${ach.icon}</div>
          <div class="ach-name">${ach.name}</div>
          <div class="ach-desc">${isUnlocked ? ach.desc : '???'}</div>
          ${isUnlocked ? '<div class="ach-date">✅ 已解锁</div>' : ''}
        </div>
      `;
    });
    html += '</div></div>';
    el.innerHTML = html;
  },

  unlockAchievement(id) {
    if (this.state.achievements.includes(id)) return;
    this.state.achievements.push(id);
    const ach = GAME_DATA.achievements.find(a => a.id === id);
    if (ach) {
      this.notify(`🏆 成就解锁: ${ach.name}`);
    }
    this.saveState();
    this.confetti();
  },

  unlockChapter(player, ch) {
    if (this.state.chapter[player] < ch) {
      this.state.chapter[player] = ch;
      this.saveState();
    }
  },

  // ===== Save/Load =====
  renderSaveLoad(el) {
    let html = '<div class="save-slots">';
    html += '<h3 style="color:var(--accent);margin-bottom:16px">💾 存档管理</h3>';
    for (let i = 1; i <= 5; i++) {
      const saveKey = 'fupo_slot_' + i;
      const saveData = localStorage.getItem(saveKey);
      let detail = '空存档';
      let time = '';
      if (saveData) {
        try {
          const d = JSON.parse(saveData);
          detail = `${GAME_DATA.players[d.player]?.name || '未知'} · 第${d.chapter?.[d.player] || 0}章`;
          time = d.saveTime || '';
        } catch(e) {}
      }
      html += `
        <div class="save-slot" onclick="G.slotAction(${i})">
          <div class="slot-num">${i}</div>
          <div class="slot-info">
            <div class="slot-name">${saveData ? '存档 ' + i : '空存档'}</div>
            <div class="slot-detail">${detail}</div>
          </div>
          <div class="slot-time">${time}</div>
        </div>
      `;
    }
    html += `
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn small" onclick="G.quickSave()">⚡ 快速存档</button>
        <button class="btn small ghost" onclick="G.quickLoad()">📂 快速读档</button>
      </div>
    `;
    html += '</div>';
    el.innerHTML = html;
  },

  slotAction(slot) {
    const saveKey = 'fupo_slot_' + slot;
    const existing = localStorage.getItem(saveKey);
    if (existing) {
      // Show options
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h3>存档 ${slot}</h3>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn" onclick="G.saveToSlot(${slot});this.closest('.modal-overlay').remove()">覆盖保存</button>
            <button class="btn gold" onclick="G.loadFromSlot(${slot});this.closest('.modal-overlay').remove()">读取存档</button>
            <button class="btn ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    } else {
      this.saveToSlot(slot);
    }
  },

  saveToSlot(slot) {
    this.state.saveTime = new Date().toLocaleString('zh-CN');
    localStorage.setItem('fupo_slot_' + slot, JSON.stringify(this.state));
    this.notify('💾 存档成功！');
    this.renderSaveLoad(document.getElementById('hub-content'));
  },

  loadFromSlot(slot) {
    const data = localStorage.getItem('fupo_slot_' + slot);
    if (data) {
      this.state = JSON.parse(data);
      this.saveState();
      this.showScreen('main-hub');
      this.renderHub();
      this.notify('📂 读档成功！');
    }
  },

  quickSave() {
    localStorage.setItem('fupo_quicksave', JSON.stringify(this.state));
    this.notify('⚡ 快速存档成功！');
  },

  quickLoad() {
    const data = localStorage.getItem('fupo_quicksave');
    if (data) {
      this.state = JSON.parse(data);
      this.saveState();
      this.showScreen('main-hub');
      this.renderHub();
      this.notify('📂 快速读档成功！');
    } else {
      this.notify('没有快速存档');
    }
  },

  exportSave() {
    const data = JSON.stringify(this.state);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fupo_save.json';
    a.click();
    URL.revokeObjectURL(url);
    this.notify('存档已导出');
  },

  importSave() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          this.state = JSON.parse(ev.target.result);
          this.saveState();
          this.notify('存档已导入');
          if (this.state.player) {
            this.showScreen('main-hub');
            this.renderHub();
          }
        } catch(err) {
          this.notify('导入失败：文件格式错误');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  resetGame() {
    if (confirm('确定要重置游戏吗？所有存档将被清除！')) {
      localStorage.clear();
      this.state = null;
      this.showScreen('title-screen');
      this.notify('游戏已重置');
    }
  },

  // ===== Time System =====
  advanceTime(hours) {
    if (!this.state.time) this.state.time = {day:1, hour:8, period:'morning'};
    this.state.time.hour += hours;
    while (this.state.time.hour >= 24) {
      this.state.time.hour -= 24;
      this.state.time.day++;
    }
    const h = this.state.time.hour;
    if (h >= 6 && h < 12) this.state.time.period = 'morning';
    else if (h >= 12 && h < 18) this.state.time.period = 'afternoon';
    else if (h >= 18 && h < 22) this.state.time.period = 'evening';
    else this.state.time.period = 'night';

    this.updateTimeDisplay();
    this.checkTimedEvents();
    this.saveState();
  },

  updateTimeDisplay() {
    const t = this.state.time;
    document.getElementById('game-time').textContent = `${String(t.hour).padStart(2,'0')}:00`;
    document.getElementById('game-day').textContent = `第${t.day}天 · ${this.getPeriodName(t.period)}`;
  },

  getPeriodName(p) {
    return {morning:'上午',afternoon:'下午',evening:'傍晚',night:'深夜'}[p] || '';
  },

  getTimeStr() {
    const h = this.state.time?.hour || 8;
    return `${String(h).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
  },

  checkTimedEvents() {
    // Trigger random messages
    if (Math.random() < 0.3) {
      const p = GAME_DATA.players[this.state.player];
      const contacts = p.contacts;
      const cid = contacts[Math.floor(Math.random() * contacts.length)];
      const c = GAME_DATA.richWomen[cid];
      if (c && this.state.relationships[cid]?.met) {
        const msgs = [
          `${c.name}发了一条朋友圈`,
          `${c.name}给你发了一条消息`,
          `你收到了${c.name}的微信`
        ];
        this.state.unread[cid] = (this.state.unread[cid] || 0) + 1;
        this.notify(msgs[Math.floor(Math.random() * msgs.length)]);
      }
    }
  },

  // ===== Utilities =====
  confetti() {
    const colors = ['#e94560','#ffd700','#4ade80','#60a5fa','#a78bfa','#ec4899'];
    for (let i = 0; i < 30; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDelay = Math.random() * 2 + 's';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }
  },

  renderTitle() {
    // Already in HTML
  }
};

// ===== Initialize =====
document.addEventListener('DOMContentLoaded', () => G.init());
G.init();
</script>
</body>
</html>
