<!-- ═══ yu.ai 子页面模板 ═══
     用法: 复制此文件，替换 {占位符} 内容
     
     需要加载:
       /shared.css (设计系统)
       /fonts/lxgwwenkai-regular.css (中文宋体)
       /fonts/lxgwwenkai-bold.css (中文粗体)
     
     组件清单:
       .page          — 900px 居中容器
       .hero          — 顶部区 (.glyph + .display + .sub + .cn + .cta)
       .section       — 章节
       .section-head  — 章节标题 (.num + h2)
       .huiwen        — 回纹分隔线 (替代 margin-top)
       .cards         — 卡片网格 (1/2/3 列自适应)
       .card-icon/.card-title/.card-desc/.card-meta
       .tip / .warn   — 提示框
       table          — 表格
       pre / code     — 代码
       .footer        — 页脚
       .theme-toggle  — 主题切换按钮
     -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{页面名} · {别名} · yu.ai</title>
<meta name="description" content="{描述}">
<meta name="theme-color" content="#170d02" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">

<!-- Design system + fonts -->
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/fonts/lxgwwenkai-regular.css">
<link rel="stylesheet" href="/fonts/lxgwwenkai-bold.css">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23170d02'/%3E%3Cg fill='none' stroke='%23f5f5f5' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M 28 32 L 42 60 M 56 32 L 42 60 L 36 78'/%3E%3Cpath d='M 64 32 L 64 60 Q 64 72 76 72 L 76 32'/%3E%3C/g%3E%3C/svg%3E">

<style>
/* 页面特有样式写在这里 */
</style>
</head>
<body>

<!-- 主题切换 -->
<button class="theme-toggle" id="theme-btn" aria-label="切换主题">
  <svg class="theme-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  <svg class="theme-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="page">

<!-- Hero -->
<div class="hero">
  <div class="glyph">{字}</div>
  <h1 class="display">{名称}<small>{别名}</small></h1>
  <p class="sub">{英文副标题}</p>
  <p class="cn">{中文副标题}</p>
  <div class="cta">
    <a href="/" class="primary">← yu.ai</a>
  </div>
</div>

<!-- 壹 · 简介 -->
<div class="section huiwen">
  <div class="section-head"><span class="num">壹</span><h2>简介</h2></div>
  <p>{内容}</p>
</div>

<!-- 贰 · 示例 -->
<div class="section huiwen">
  <div class="section-head"><span class="num">贰</span><h2>{标题}</h2></div>
  <pre><code>{代码}</code></pre>
</div>

<!-- 叁 · 特性 -->
<div class="section huiwen">
  <div class="section-head"><span class="num">叁</span><h2>特性</h2></div>
  <div class="cards">
    <div>
      <div class="card-icon">{字}</div>
      <div class="card-title">{标题}</div>
      <div class="card-desc">{描述}</div>
    </div>
    <!-- 更多卡片... -->
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <span>yu.ai</span>
  <span>{页面名} · {别名}</span>
  <span>mit</span>
</div>

</div>

<!-- 主题切换脚本 -->
<script>
(function(){
  var btn=document.getElementById('theme-btn');
  if(!btn)return;
  var root=document.documentElement;
  var sun=btn.querySelector('.theme-sun');
  var moon=btn.querySelector('.theme-moon');
  function sync(i){if(sun)sun.style.display=i?'none':'block';if(moon)moon.style.display=i?'block':'none'}
  var s;try{s=localStorage.getItem('yuai-theme')}catch(_){}
  if(s==='light'){root.setAttribute('data-theme','light');sync(true)}
  else if(s==='dark'){root.setAttribute('data-theme','dark');sync(false)}
  else{var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)');sync(m&&m.matches)}
  btn.onclick=function(){
    var n=root.getAttribute('data-theme')!=='light';
    if(!root.getAttribute('data-theme')){n=!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches)}
    root.setAttribute('data-theme',n?'light':'dark');
    try{localStorage.setItem('yuai-theme',n?'light':'dark')}catch(_){}
    sync(n);
  };
})();
</script>
</body>
</html>
