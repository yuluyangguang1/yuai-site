// ── Theme toggle (matches the rest of the site) ─────────────────
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}
var btn=document.getElementById('theme-btn');
if(btn){
  var html=document.documentElement;
  var sun=btn.querySelector('.theme-sun');
  var moon=btn.querySelector('.theme-moon');
  function syncIcons(L){sun.style.display=L?'none':'block';moon.style.display=L?'block':'none';}
  var saved=lsGet('yuai-theme');
  if(saved==='light'){html.setAttribute('data-theme','light');syncIcons(true);}
  else if(saved==='dark'){html.setAttribute('data-theme','dark');syncIcons(false);}
  else{var mql=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)');syncIcons(mql&&mql.matches);}
  btn.onclick=function(){
    var L=html.getAttribute('data-theme')!=='light';
    if(!html.getAttribute('data-theme')){var sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;L=!sys;}
    html.setAttribute('data-theme',L?'light':'dark');lsSet('yuai-theme',L?'light':'dark');syncIcons(L);
  };
}
var fy=document.getElementById('footer-year');
if(fy)fy.textContent='mit · '+new Date().getFullYear();

// ── Data plumbing ───────────────────────────────────────────────
// We don't hit api.github.com from the page anymore — that
// rate-limits anonymous clients to 60 req/h per IP, which a
// shared NAT trips during a single demo. A GitHub Action in
// yuluyangguang1/hermes-updates runs every 30 minutes,
// authenticates with GITHUB_TOKEN (5000/h), and commits the
// fetched release lists to /data/*.json. We load those static
// files instead. Fall back to the GitHub API only if the JSON
// snapshots are unreachable (first time, broken Action, etc).
var FEEDS={
  portable:{
    json:'data/portable.json',
    jsonRaw:'https://raw.githubusercontent.com/yuluyangguang1/hermes-updates/main/data/portable.json',
    apiFallback:'https://api.github.com/repos/yuluyangguang1/hermes-portable/releases?per_page=50',
    cacheKey:'hermes-changelog-portable-v2',
    label:'便携版'
  },
  standard:{
    json:'data/standard.json',
    jsonRaw:'https://raw.githubusercontent.com/yuluyangguang1/hermes-updates/main/data/standard.json',
    apiFallback:'https://api.github.com/repos/NousResearch/hermes-agent/releases?per_page=50',
    cacheKey:'hermes-changelog-standard-v2',
    label:'上游 hermes-agent'
  }
};
var CACHE_TTL=30*60*1000;

function readCache(key){
  try{
    var raw=lsGet(key);if(!raw)return null;
    var p=JSON.parse(raw);
    if(!p||!p.t||Date.now()-p.t>CACHE_TTL)return null;
    return p.d;
  }catch(_){return null;}
}
function writeCache(key,data){
  lsSet(key,JSON.stringify({t:Date.now(),d:data}));
}

async function fetchFeed(feedKey){
  var f=FEEDS[feedKey];
  var c=readCache(f.cacheKey);
  if(c)return {data:c,fromCache:true};

  // Try the same-origin static JSON first (the Action keeps it
  // fresh every 30 min). If yuai-site sync has caught up, this
  // file lives at /hermes/changelog/data/portable.json.
  var raw=null;
  try{
    var r=await fetch(f.json,{cache:'no-store'});
    if(r.ok)raw=await r.json();
  }catch(_){}

  // Fallback 1: same JSON, served from raw.githubusercontent
  // (which is what the Action commits to). Useful before the
  // yuai-site mirror has caught up.
  if(!raw){
    try{
      var r2=await fetch(f.jsonRaw,{cache:'no-store'});
      if(r2.ok)raw=await r2.json();
    }catch(_){}
  }

  // Fallback 2: hit GitHub API directly. May 403 if the visitor
  // burned their anon quota, but at worst we show the friendly
  // error state — never a stale/blank page.
  if(!raw){
    var r3=await fetch(f.apiFallback,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!r3.ok)throw new Error('GitHub '+r3.status+' '+r3.statusText);
    raw=await r3.json();
  }

  var entries=raw.map(parseRelease).filter(Boolean);
  writeCache(f.cacheKey,entries);
  return {data:entries,fromCache:false};
}

// ── Parse a GitHub release into our normalized shape ────────────
function parseRelease(r){
  if(r.draft)return null;
  var version=(r.tag_name||r.name||'').replace(/^v/,'').trim();
  if(!version)return null;
  var body=r.body||'';
  return {
    version:version,
    name:r.name||version,
    date:(r.published_at||r.created_at||'').slice(0,10),
    url:r.html_url,
    isPrerelease:!!r.prerelease,
    isLatest:false, // assigned by the renderer
    body:body,
    changes:extractChanges(body)
  };
}

// ── Body parser ─────────────────────────────────────────────────
// GitHub release bodies are unstructured Markdown. We pull out
// bullet lines and bucket each into added / fixed / changed /
// removed / security based on conventional prefixes (Conventional
// Commits, "What's Changed" sections, etc.). Anything we can't
// classify lands in "changed".
var TYPE_PATTERNS=[
  {type:'security',re:/^(?:sec(?:urity)?|cve|vuln)[:\s\-]/i},
  {type:'security',re:/\b(?:cve-\d{4}-\d+|vulnerability)\b/i},
  {type:'added',   re:/^(?:feat(?:ure)?|add(?:ed|s)?|new)[:\s\-]/i},
  {type:'added',   re:/^[\+\*]\s+(?:add|new)/i},
  {type:'fixed',   re:/^(?:fix(?:ed|es)?|bug|hotfix|patch)[:\s\-]/i},
  {type:'fixed',   re:/^[\+\*]\s+fix/i},
  {type:'removed', re:/^(?:remove(?:d)?|delete(?:d)?|drop(?:ped)?|deprecate(?:d)?)[:\s\-]/i},
  {type:'changed', re:/^(?:change(?:d)?|update(?:d)?|chore|refactor|perf|docs?|style|build|ci|test)[:\s\-]/i}
];

function classifyLine(line){
  for(var i=0;i<TYPE_PATTERNS.length;i++){
    if(TYPE_PATTERNS[i].re.test(line))return TYPE_PATTERNS[i].type;
  }
  return 'changed';
}

function extractChanges(body){
  if(!body)return [];
  // Real-world release bodies use four different layouts:
  //   1. Conventional bullets:    - fix(x): ...
  //   2. Numbered lists:          1. 解压 ...
  //   3. Markdown tables:         | 平台 | 操作 |
  //   4. ### 标题 + 段落
  //
  // We use a section-aware pass that only collects items from
  // sections that look like a changelog (### Changes / 变更 /
  // 更新 / What's New / 修复 / 新增 ...). Static sections like
  // 下载 / 首次使用 / 安装说明 are intentionally skipped — they
  // are install boilerplate that's identical across releases.
  // If no changelog section is found, fall back to whatever
  // bullets exist anywhere in the body, then to the body's
  // first 200 chars as a final summary.
  var CHANGELOG_HEADING=/^#{1,4}\s*(Changes?|Changelog|What'?s?\s*(New|Changed)|新增|变更|修复|更新|改进|Fixed|Added|Improvements|Highlights|Release Notes|发布说明)/i;
  var SKIP_HEADING=/^#{1,4}\s*(Download|下载|首次使用|安装|Install(?:ation)?|Quick\s*Start|快速开始|启动方式|要求|Requirements|权限|FAQ|常见问题|致谢|Credits|Thanks)/i;
  var lines=body.replace(/\r/g,'').split('\n');
  var out=[];
  var maxItems=60;

  function pushItem(typeHint, text){
    text=text.trim();
    if(!text)return;
    if(text.length>500)text=text.slice(0,497)+'…';
    var type=typeHint||classifyLine(text);
    var labelMatch=text.match(/^\*\*([^*]+)\*\*\s*[:\-—]?\s*(.*)$/);
    if(labelMatch){
      type=classifyLine(labelMatch[1])||type;
      text=(labelMatch[2]||labelMatch[1]).trim();
    }
    if(!text)return;
    out.push({type:type,raw:text,zh:translateLine(text)});
  }

  function harvest(scopedLines, requireChangelogSection){
    var inChangelog=!requireChangelogSection;
    var inSkip=false;
    var inCode=false;
    for(var i=0;i<scopedLines.length && out.length<maxItems;i++){
      var raw=scopedLines[i];
      if(/^\s*```/.test(raw)){inCode=!inCode;continue;}
      if(inCode)continue;
      if(/^\s*\|/.test(raw))continue; // skip table rows
      var heading=raw.match(/^#{1,4}\s+/);
      if(heading){
        if(CHANGELOG_HEADING.test(raw)){inChangelog=true;inSkip=false;continue;}
        if(SKIP_HEADING.test(raw)){inSkip=true;inChangelog=false;continue;}
        // Other heading: keep current scope state but reset
        // skip flag (e.g. "## v0.8.8" version subheaders).
        inSkip=false;
        if(!requireChangelogSection)inChangelog=true;
        continue;
      }
      if(inSkip)continue;
      if(!inChangelog)continue;
      // bullets
      if(/^[\s>]{0,4}[\-\*\+]\s+/.test(raw)){
        pushItem(null,raw.replace(/^[\s>]{0,4}[\-\*\+]\s+/,''));
      }
      // numbered
      else if(/^\s{0,4}\d+\.\s+/.test(raw)){
        pushItem('changed',raw.replace(/^\s{0,4}\d+\.\s+/,''));
      }
    }
  }

  // Pass 1: only harvest from changelog-labeled sections
  harvest(lines, true);

  // Pass 2: nothing labeled — accept any bullet/numbered item
  // outside of explicitly-skipped install sections.
  if(!out.length){
    out=[];
    harvest(lines, false);
  }

  // Pass 3: still nothing — surface the first non-trivial
  // paragraph as a single summary item so the entry isn't blank.
  if(!out.length){
    var summary='';
    for(var i=0;i<lines.length;i++){
      var l=lines[i].trim();
      if(!l||/^[#>|`]/.test(l))continue;
      summary=l;break;
    }
    if(summary)pushItem('changed',summary);
  }

  if(out.length>=maxItems){
    out.push({type:'changed',raw:'…(more changes available on GitHub)',zh:'…（更多变更见 GitHub release 页面）'});
  }
  return out;
}

// ── Lightweight translation helper (opt-in) ─────────────────────
// We deliberately do NOT auto-translate the whole entry body.
// GitHub release notes carry technical detail (PR refs, code
// snippets, type signatures) that a keyword swap easily mangles.
// Instead we keep the original English text as the source of
// truth and provide a per-entry globe toggle that runs a curated
// keyword pass on demand. Users see a clear "自动翻译" caption
// and can flip back any time.
//
// Coverage: top ~80 hermes-flavored verbs/nouns. Stop words
// (a/an/the/and/or/etc) are intentionally NOT removed — that
// produced garbled output. The result reads as half-Chinese
// hint, not a real translation, which matches user expectation
// when they explicitly hit the toggle.
var DICT=[
  // longer / more specific phrases first so they don't get
  // partially eaten by single-word rules below
  [/\bWhat's Changed\b/gi,'变更内容'],
  [/\bNew Contributors?\b/gi,'新贡献者'],
  [/\bbreaking changes?\b/gi,'破坏性变更'],
  [/\bsecurity (fix|patch|update)\b/gi,'安全修复'],
  [/\bperformance improvements?\b/gi,'性能改进'],
  [/\bbug ?fix(?:es)?\b/gi,'问题修复'],
  [/\brace conditions?\b/gi,'竞态条件'],
  [/\bmemory leaks?\b/gi,'内存泄漏'],
  [/\bbackward[- ]compat(?:ibility|ible)?\b/gi,'向后兼容'],
  [/\brate limits?\b/gi,'速率限制'],
  [/\brelease notes?\b/gi,'发布说明'],
  [/\bcommunity contributions?\b/gi,'社区贡献'],
  // verbs (action prefixes)
  [/\bfix(?:e[ds]|ing)?\b/gi,'修复'],
  [/\badd(?:ed|s|ing)?\b/gi,'新增'],
  [/\bremove(?:s|d|ing)?\b/gi,'移除'],
  [/\bdelete(?:s|d|ing)?\b/gi,'删除'],
  [/\bupdate(?:s|d|ing)?\b/gi,'更新'],
  [/\bupgrade(?:s|d|ing)?\b/gi,'升级'],
  [/\bdrop(?:s|ped|ping)?\b/gi,'移除'],
  [/\bdeprecate(?:s|d|ing)?\b/gi,'废弃'],
  [/\bpreserve(?:s|d|ing)?\b/gi,'保留'],
  [/\bensure(?:s|d|ing)?\b/gi,'确保'],
  [/\bprevent(?:s|ed|ing)?\b/gi,'避免'],
  [/\bavoid(?:s|ed|ing)?\b/gi,'避免'],
  [/\bsupport(?:s|ed|ing)?\b/gi,'支持'],
  [/\benable(?:s|d|ing)?\b/gi,'启用'],
  [/\bdisable(?:s|d|ing)?\b/gi,'禁用'],
  [/\bhonor(?:s|ed|ing)?\b/gi,'遵循'],
  [/\bhandle(?:s|d|ing)?\b/gi,'处理'],
  [/\brefactor(?:s|ed|ing)?\b/gi,'重构'],
  [/\boptimize(?:s|d|ing)?\b/gi,'优化'],
  [/\bimprove(?:s|d|ing|ments?)?\b/gi,'改进'],
  [/\bclean(?:s|ed|ing|up)?\b/gi,'清理'],
  [/\bmigrate(?:s|d|ing)?\b/gi,'迁移'],
  [/\brevert(?:s|ed|ing)?\b/gi,'回滚'],
  // nouns
  [/\bchangelog\b/gi,'更新日志'],
  [/\bdocument(?:s|ed|ing|ation)?\b/gi,'文档'],
  [/\bdocs\b/gi,'文档'],
  [/\bgateway\b/gi,'网关'],
  [/\bplugin\b/gi,'插件'],
  [/\bextension\b/gi,'扩展'],
  [/\bsessions?\b/gi,'会话'],
  [/\bsettings?\b/gi,'设置'],
  [/\bauthentication\b/gi,'认证'],
  [/\bauthorization\b/gi,'授权'],
  [/\bcache\b/gi,'缓存'],
  [/\bchannels?\b/gi,'频道'],
  [/\bmemory\b/gi,'记忆'],
  [/\bskills?\b/gi,'技能'],
  [/\bmodels?\b/gi,'模型'],
  [/\bports?\b/gi,'端口'],
  [/\brequests?\b/gi,'请求'],
  [/\bresponses?\b/gi,'响应'],
  [/\btimeouts?\b/gi,'超时'],
  [/\berrors?\b/gi,'错误'],
  [/\bwarnings?\b/gi,'警告'],
  [/\breleases?\b/gi,'版本'],
  [/\bversions?\b/gi,'版本'],
  [/\bworkflows?\b/gi,'工作流'],
  [/\binstall(?:ation|er|ed|ing|s)?\b/gi,'安装'],
  [/\buninstall\b/gi,'卸载'],
  [/\bdownload(?:s|ed|ing)?\b/gi,'下载'],
  [/\bportable\b/gi,'便携版'],
  [/\bdesktop\b/gi,'桌面'],
  [/\bbrowser\b/gi,'浏览器'],
  [/\bnotifications?\b/gi,'通知'],
  // hermes-specific
  [/\bhermes[- ]agent\b/gi,'hermes-agent'],
  [/\bsub[- ]?agents?\b/gi,'子代理'],
  [/\bagents?\b/gi,'代理'],
  [/\bcrons?\b/gi,'定时任务'],
  [/\bschedul(?:e|er|ed|ing)\b/gi,'调度'],
  [/\bdaemons?\b/gi,'守护进程'],
  [/\btools?\b/gi,'工具'],
  [/\bMCP\b/g,'MCP'],
  [/\bcontext\b/gi,'上下文'],
  [/\bembedding(?:s)?\b/gi,'向量'],
  [/\bvector\s*(?:store|db|database)\b/gi,'向量库'],
  [/\bpromp(?:t|ts|ting)\b/gi,'提示'],
  [/\bsystem\s*prompt\b/gi,'系统提示'],
  [/\bhooks?\b/gi,'钩子'],
  [/\btoken(?:s)?\b/gi,'token']
];

function translateLine(s){
  if(!s)return s;
  // Preserve `code`, URLs, @mentions, #N references verbatim.
  var stash=[];
  function st(re){s=s.replace(re,function(m){stash.push(m);return '\u0001'+(stash.length-1)+'\u0001';});}
  st(/`[^`]+`/g);
  st(/\bhttps?:\/\/\S+/g);
  st(/@[a-zA-Z0-9_-]+/g);
  st(/#\d+/g);

  for(var i=0;i<DICT.length;i++){
    s=s.replace(DICT[i][0],DICT[i][1]);
  }
  // collapse double spaces from successive replacements
  s=s.replace(/\s{2,}/g,' ').trim();
  s=s.replace(/\u0001(\d+)\u0001/g,function(_,n){return stash[+n];});
  return s;
}

// ── Render ───────────────────────────────────────────────────────
var CURRENT_TAB='portable';
var CURRENT_FILTER='all';
var CURRENT_SEARCH='';
// Default to translated view. User can flip back to verbatim
// English via the globe chip (state persists in localStorage).
var saved_t=lsGet('hermes-changelog-translate');
var TRANSLATE=saved_t==null?true:(saved_t==='1');
var DATA={portable:[],standard:[]};
var META={portable:{loaded:false,fromCache:false,error:null},standard:{loaded:false,fromCache:false,error:null}};

function fmtDate(s){
  if(!s)return '';
  // GitHub returns ISO; we already trimmed to YYYY-MM-DD.
  return s;
}

function renderTimeline(){
  var entries=DATA[CURRENT_TAB]||[];
  var meta=META[CURRENT_TAB];
  var node=document.getElementById('timeline');
  var loading=document.getElementById('loadingState');

  if(!meta.loaded){
    node.innerHTML='';
    loading.textContent='正在从 GitHub 拉取「'+FEEDS[CURRENT_TAB].label+'」releases…';
    loading.style.display='block';
    loading.classList.remove('error');
    return;
  }
  if(meta.error){
    node.innerHTML='';
    loading.innerHTML='加载失败：'+escapeHtml(String(meta.error))+'<br><small style="opacity:.6">可能是 GitHub 速率限制或网络问题。30 分钟后会自动重试，或刷新页面重试。</small>';
    loading.style.display='block';
    loading.classList.add('error');
    return;
  }

  // Apply filter + search.
  var q=CURRENT_SEARCH.trim().toLowerCase();
  var visible=entries.filter(function(e){
    if(q){
      var hay=(e.version+' '+(e.name||'')+' '+(e.body||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    if(CURRENT_FILTER==='all')return true;
    return (e.changes||[]).some(function(c){return c.type===CURRENT_FILTER;});
  });

  if(!visible.length){
    node.innerHTML='';
    loading.textContent=q?'没有匹配「'+q+'」的版本':'没有任何版本数据';
    loading.style.display='block';
    loading.classList.remove('error');
    return;
  }
  loading.style.display='none';

  // Mark the most recent stable release as "latest".
  var latestIdx=-1;
  for(var i=0;i<visible.length;i++){
    if(!visible[i].isPrerelease){latestIdx=i;break;}
  }

  var html=visible.map(function(e,i){
    var tags=[];
    if(i===latestIdx)tags.push('<span class="tag tag-latest">最新</span>');
    if(e.isPrerelease)tags.push('<span class="tag tag-major">预发布</span>');
    if(CURRENT_TAB==='portable')tags.push('<span class="tag tag-portable">便携版</span>');
    var changesHtml=(e.changes||[]).map(function(c){
      var txt=TRANSLATE?(c.zh||c.raw||''):(c.raw||c.zh||'');
      return '<li><span class="change-icon '+c.type+'">'+typeLabel(c.type)+'</span><span class="change-text">'+linkify(escapeHtml(txt))+'</span></li>';
    }).join('');
    if(!changesHtml){
      var bodyTrim=(e.body||'').trim();
      if(bodyTrim){
        var summary=bodyTrim.split('\n').slice(0,3).join(' / ');
        if(TRANSLATE)summary=translateLine(summary);
        changesHtml='<li><span class="change-icon changed">'+typeLabel('changed')+'</span><span class="change-text">'+linkify(escapeHtml(summary)).slice(0,400)+'</span></li>';
      }else{
        changesHtml='<li><span class="change-icon changed">'+typeLabel('changed')+'</span><span class="change-text">（此版本未提供变更说明）</span></li>';
      }
    }
    return ''+
      '<article class="entry'+(i===latestIdx?' latest':'')+'">'+
        '<div class="entry-meta">'+
          '<div class="entry-version">v'+escapeHtml(e.version)+'</div>'+
          '<div class="entry-date">'+escapeHtml(fmtDate(e.date))+'</div>'+
          '<div class="entry-tags">'+tags.join('')+'</div>'+
        '</div>'+
        '<div class="entry-body">'+
          '<div class="entry-title">'+escapeHtml(e.name||('v'+e.version))+'</div>'+
          '<ul class="changes">'+changesHtml+'</ul>'+
          '<div class="entry-footer">'+
            '<a href="'+escapeAttr(e.url)+'" target="_blank" rel="noopener">在 GitHub 查看 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-left:2px" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>'+
            '<span>共 '+(e.changes||[]).length+' 项变更</span>'+
          '</div>'+
        '</div>'+
      '</article>';
  }).join('');
  node.innerHTML=html;
}

function typeLabel(t){
  return ({added:'新增',fixed:'修复',changed:'变更',removed:'移除',security:'安全'})[t]||'变更';
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function escapeAttr(s){return escapeHtml(s);}

// Convert https://github.com/owner/repo/(pull|issues)/N → #N link
// and preserve other URLs as plain links.
function linkify(html){
  return html.replace(/https?:\/\/[^\s<>"']+/g,function(u){
    var label=u;
    var pr=u.match(/github\.com\/[^\/]+\/[^\/]+\/(?:pull|issues)\/(\d+)/);
    if(pr)label='#'+pr[1];
    return '<a href="'+u+'" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;text-decoration-color:rgb(var(--accent-base) / .3)">'+escapeHtml(label)+'</a>';
  });
}

// ── Wire up tabs / filters / search ─────────────────────────────
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    CURRENT_TAB=t.dataset.tab;
    renderTimeline();
    refreshStatusBar();
  });
});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
    c.classList.add('active');
    CURRENT_FILTER=c.dataset.filter;
    renderTimeline();
  });
});
var sb=document.getElementById('searchBox');
if(sb){
  var t;
  sb.addEventListener('input',function(){
    clearTimeout(t);
    t=setTimeout(function(){CURRENT_SEARCH=sb.value;renderTimeline();},150);
  });
}

// Translate toggle: persists to localStorage. We never auto-flip
// it on, so first-time visitors always see verbatim English from
// GitHub (the safest default — no mistranslations).
var trChip=document.getElementById('translateChip');
if(trChip){
  if(TRANSLATE)trChip.classList.add('active');
  trChip.addEventListener('click',function(){
    TRANSLATE=!TRANSLATE;
    lsSet('hermes-changelog-translate',TRANSLATE?'1':'0');
    trChip.classList.toggle('active',TRANSLATE);
    renderTimeline();
  });
}

function refreshStatusBar(){
  var pCount=DATA.portable.length,sCount=DATA.standard.length;
  document.getElementById('cnt-portable').textContent='· '+(META.portable.loaded?pCount:'…');
  document.getElementById('cnt-standard').textContent='· '+(META.standard.loaded?sCount:'…');
  var meta=META[CURRENT_TAB];
  var sync=document.getElementById('syncStatus');
  var last=document.getElementById('lastSync');
  if(!meta.loaded){
    sync.textContent='正在同步…';
    sync.previousElementSibling.classList.remove('warn');sync.previousElementSibling.classList.add('dim');
  }else if(meta.error){
    sync.textContent='同步失败 · 请稍后重试';
    var d=sync.previousElementSibling;d.classList.remove('dim');d.classList.add('warn');
  }else{
    sync.textContent=meta.fromCache?'已加载（缓存）':'已同步';
    var d2=sync.previousElementSibling;d2.classList.remove('warn','dim');
    last.textContent='共 '+DATA[CURRENT_TAB].length+' 个版本 · '+new Date().toLocaleTimeString('zh-CN');
  }
}

// ── Boot ────────────────────────────────────────────────────────
async function loadFeed(key){
  try{
    var r=await fetchFeed(key);
    DATA[key]=r.data;
    META[key]={loaded:true,fromCache:r.fromCache,error:null};
  }catch(err){
    console.warn('[changelog] failed to load',key,err);
    META[key]={loaded:true,fromCache:false,error:err.message||String(err)};
    DATA[key]=[];
  }
}

(async function boot(){
  refreshStatusBar();
  // Load both feeds in parallel; render whichever finishes first.
  var pP=loadFeed('portable').then(function(){if(CURRENT_TAB==='portable'){renderTimeline();refreshStatusBar();}});
  var pS=loadFeed('standard').then(function(){if(CURRENT_TAB==='standard'){renderTimeline();refreshStatusBar();}});
  await Promise.all([pP,pS]);
  refreshStatusBar();
})();

})();

<script>
(function(){
  // Theme toggle
  try{
    var btn=document.getElementById('theme-btn');
    if(btn){
      var root=document.documentElement,sun=btn.querySelector('.theme-sun'),moon=btn.querySelector('.theme-moon');
      function sync(i){if(sun)sun.style.display=i?'none':'block';if(moon)moon.style.display=i?'block':'none'}
      var sv;try{sv=localStorage.getItem('yuai-theme')}catch(_){}
      if(sv==='light'){root.setAttribute('data-theme','light');sync(true)}
      else if(sv==='dark'){root.setAttribute('data-theme','dark');sync(false)}
      else{var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)');sync(m&&m.matches)}
      btn.onclick=function(){
        var n=root.getAttribute('data-theme')!=='light';
        if(!root.getAttribute('data-theme')){n=!(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches)}
        root.setAttribute('data-theme',n?'light':'dark');try{localStorage.setItem('yuai-theme',n?'light':'dark')}catch(_){}sync(n);
      };
    }
  }catch(_){}
  // Footer year
  try{var fy=document.getElementById('footer-year');if(fy)fy.textContent='mit · '+new Date().getFullYear()}catch(_){}
})();
</script>
