<script>
  /* ?mod= 决定这道门是谁。母版目前只有一道（八字的），所以先只换匾名与题注；
     但接线已经留好了：mods.js 那道门一旦补上 src / rect / plaque / disc，
     这里就照它渲染，不必再动 art.js —— 逐道门的标注只有 mods.js 那一份。 */
  (function () {
    var k = new URLSearchParams(location.search).get('m') || new URLSearchParams(location.search).get('mod') || 'daily';
    if (!k || !window.ttMod) return;
    var m = window.ttMod(k), art = document.getElementById('art');
    art.dataset.name = m.name;
    art.dataset.mod = m.key;
    if (m.src) art.dataset.src = m.src;
    if (m.rect) art.dataset.rect = m.rect;
    if (m.plaque) art.dataset.plaque = m.plaque;
    if (m.disc) art.dataset.disc = m.disc;
    var h = document.getElementById('artH1');
    if (h) h.textContent = '天機閣 · ' + m.slot + ' · ' + m.name + '之门';
    var cap = document.querySelector('.tt-art__cap');
    if (cap) cap.textContent = m.src ? m.slot + ' · ' + m.name
      : m.slot + ' · ' + m.name + ' · 这道门还借着八字的母版';
  })();
</script>
