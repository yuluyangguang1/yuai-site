        function once(){

            if (!window.__fortuneReloaded) { window.__fortuneReloaded = 1; location.reload(); }
          }

        window.addEventListener('vite:preloadError', function(e){ e.preventDefault(); once(); });

          var m = String((e && e.reason && (e.reason.message || e.reason)) || '');

          var t = e && e.target, u = t && (t.src || t.href) || '';
          if (/assets\/[^"']*\.(js|css)/.test(u)) { once(); }
