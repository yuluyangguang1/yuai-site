    <!-- 防止主题闪烁：在 CSS 加载前读取 localStorage -->
    <script>
      (function(){
        try {
          var s = localStorage.getItem('fortune-settings');
          if (s) {
            var d = JSON.parse(s);
            if (d && d.state && d.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch(e){}
      })();
    </script>

      html.dark, html.dark body {

      }
      .app-loader.fade-out {

      }
      html.dark .loader-text { color: #C9A85C; }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
