<main class="wrap"><h1>化忌</h1><p class="h1sub">四化 · 凶化</p><p><span class="chip">凶化</span><span class="chip chip-o">四化</span></p>
<div class="sec"><h2>词条释义</h2><p class="p">执念、阻碍、纠结。所在宫位需特别关注。</p></div>

<div class="sec"><h2>关于「四化」</h2><p class="p">四化者，禄权科忌也，乃斗数论命之机关。生年四化定一生之趋，宫干飞化明彼此之缘。禄为增益，权为掌控，科为名誉，忌为执念——得禄未必皆福，逢忌未必皆凶。</p></div><div class="sec"><h2>由此排盘</h2><p class="rel"><a href="/fortune/ziwei/">紫微排盘 →</a><a href="/fortune/crossref/">八字×紫微综合印证 →</a><a href="/fortune/daily/">今日运势 →</a><a href="/fortune/">全部工具</a></p></div>
