# 免费模型活动 · 每日自动核对过期 + 自动搜集新活动
# - 核对:逐个探测 key-data.json 中各活动链接,连续 3 次失败自动标记过期
# - 搜集:从 AI HOT 匿名 API 抓取含免费额度关键词的资讯,写入 key-candidates.json
# 修改后由本 workflow 自动提交推送;无需任何额外密钥(GITHUB_TOKEN 即可)
name: refresh free offers

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00 北京时间
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-offers
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: verify & collect
        run: node scripts/refresh-offers.mjs

      - name: commit & push
        run: |
          git config user.name "yuai-bot"
          git config user.email "bot@yuai-r.cn"
          git add key-data.json key-candidates.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: refresh free offers (daily verify + AI HOT collect)"
            git push
          fi
