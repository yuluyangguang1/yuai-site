name: Sync changelog data

# Pulls release-feed JSON snapshots into the static changelog pages.
#
# What this WILL do:
#   - Mirror data/portable.json + data/standard.json from each
#     project's "-updates" repo into:
#       openclaw/changelog/data/*.json
#       hermes/changelog/data/*.json
#
# What this will NOT do (anymore):
#   - It will NOT overwrite openclaw/changelog/index.html or
#     hermes/changelog/index.html. Both pages are maintained
#     directly in this repo (yuai-site) so they stay in sync
#     with the rest of the site's design system.
#
# Triggers:
#   - Every 30 minutes via cron
#   - Manual workflow_dispatch
#   - On push to main (workflow file changes only)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-manuals.yml"

permissions:
  contents: write

concurrency:
  group: sync-subpages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yuai-site
        uses: actions/checkout@v4

      - name: Pull release-feed JSON snapshots
        run: |
          set -euo pipefail
          mkdir -p openclaw/changelog/data hermes/changelog/data

          # OpenClaw — sourced from yuluyangguang1/openclaw-updates
          for slug in portable standard; do
            url="https://raw.githubusercontent.com/yuluyangguang1/openclaw-updates/main/data/${slug}.json"
            curl -fsSL --retry 3 "$url" -o "openclaw/changelog/data/${slug}.json.new" || true
          done
          for f in openclaw/changelog/data/portable.json.new openclaw/changelog/data/standard.json.new; do
            [ -f "$f" ] && mv "$f" "${f%.new}"
          done

          # Hermes — sourced from yuluyangguang1/hermes-updates
          # Same shape: data/portable.json (yuluyangguang1/hermes-portable)
          # + data/standard.json (NousResearch/hermes-agent).
          # Failures are non-fatal so a missing upstream feed
          # doesn't block the openclaw sync.
          for slug in portable standard; do
            url="https://raw.githubusercontent.com/yuluyangguang1/hermes-updates/main/data/${slug}.json"
            curl -fsSL --retry 3 "$url" -o "hermes/changelog/data/${slug}.json.new" || true
          done
          for f in hermes/changelog/data/portable.json.new hermes/changelog/data/standard.json.new; do
            [ -f "$f" ] && mv "$f" "${f%.new}"
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openclaw/changelog/data hermes/changelog/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "sync: refresh changelog feed JSON

          sources:
          - openclaw-updates@main / data/portable.json + standard.json
          - hermes-updates@main   / data/portable.json + standard.json"
          git push
