name: Sync changelog data

# Syncs the changelog page and release-feed JSON from openclaw-updates.
#
# NOTE: openclaw/index.html and hermes/index.html are now maintained
# directly in this repo (yuai-site). The portable repos only ship a
# redirect page, so we no longer sync product pages from them.
#
# Triggers:
#   - Every 30 minutes via cron
#   - Manual workflow_dispatch
#   - On push to main (workflow file changes only)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-manuals.yml"

permissions:
  contents: write

concurrency:
  group: sync-subpages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yuai-site
        uses: actions/checkout@v4

      - name: Pull changelog + release feeds
        run: |
          set -euo pipefail
          mkdir -p openclaw/changelog openclaw/changelog/data

          # Changelog page (from openclaw-updates repo)
          CL_URL="https://raw.githubusercontent.com/yuluyangguang1/openclaw-updates/main/index.html"
          curl -fsSL --retry 3 "$CL_URL" -o openclaw/changelog/index.html.new

          # Release-feed JSON snapshots
          for slug in portable standard; do
            url="https://raw.githubusercontent.com/yuluyangguang1/openclaw-updates/main/data/${slug}.json"
            curl -fsSL --retry 3 "$url" -o "openclaw/changelog/data/${slug}.json.new" || true
          done

          # Inline tweaks for changelog page
          if [ -f openclaw/changelog/index.html.new ]; then
            sed -i 's|src="https://yu.ai/egret-ink.jpg"|src="/egret-ink.jpg"|g' openclaw/changelog/index.html.new
            sed -i 's|https://yu\.ai/|https://yuai-r.cn/|g' openclaw/changelog/index.html.new
            mv openclaw/changelog/index.html.new openclaw/changelog/index.html
          fi

          # JSON snapshots: promote .new -> final
          for f in openclaw/changelog/data/portable.json.new openclaw/changelog/data/standard.json.new; do
            if [ -f "$f" ]; then mv "$f" "${f%.new}"; fi
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openclaw/changelog/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "sync: pull latest changelog + release feeds

          source: openclaw-updates@main / index.html + data/*.json"
          git push
