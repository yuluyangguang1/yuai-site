<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 抓娃娃机 - 沉浸式体验</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  overflow: hidden;
  background: #000;
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  touch-action: none;
}

#canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* Loading */
.loading {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0a0a1a, #1a1a3a);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 1s;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-ring {
  width: 80px;
  height: 80px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #e74c3c;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  margin-top: 24px;
  color: rgba(255,255,255,0.6);
  font-size: 16px;
}

.loading-hint {
  margin-top: 8px;
  color: rgba(255,255,255,0.3);
  font-size: 12px;
}

/* HUD */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

.hud > * { pointer-events: auto; }

/* Top bar */
.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.game-title {
  font-size: 20px;
  font-weight: 800;
  color: #e74c3c;
  text-shadow: 0 0 20px rgba(231,76,60,0.5);
}

.stats {
  display: flex;
  gap: 24px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.8);
  font-size: 14px;
}

.stat-value {
  font-weight: 700;
  color: #f39c12;
  font-size: 18px;
  font-family: 'Courier New', monospace;
}

/* Gyro indicator */
.gyro-indicator {
  position: absolute;
  top: 70px;
  right: 20px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  color: #2ecc71;
  display: none;
  align-items: center;
  gap: 6px;
}

.gyro-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2ecc71;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Controls */
.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
}

.controls-row {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 400px;
  margin: 0 auto;
}

/* Joystick */
.joystick-area {
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  position: relative;
  cursor: pointer;
}

.joystick-knob {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  background: radial-gradient(circle, #e74c3c, #c0392b);
  border-radius: 50%;
  box-shadow: 0 4px 12px rgba(231,76,60,0.4);
}

/* Grab button */
.grab-btn {
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, #e74c3c, #c0392b);
  border: 4px solid #96281b;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 0 #96281b, 0 8px 20px rgba(231,76,60,0.4);
  transition: all 0.1s;
  letter-spacing: 2px;
}

.grab-btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #96281b, 0 4px 10px rgba(231,76,60,0.3);
}

/* Instructions */
.instructions {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 12px;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}

.instruction {
  display: flex;
  align-items: center;
  gap: 4px;
}

.key {
  background: rgba(255,255,255,0.1);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
  font-family: monospace;
}

/* Camera hint */
.camera-hint {
  position: absolute;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  text-align: center;
}

/* Crosshair */
.crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  pointer-events: none;
}

/* Achievement popup */
.achievement {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(135deg, #2c2c3e, #1a1a2e);
  border: 2px solid #f39c12;
  border-radius: 12px;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 200;
  box-shadow: 0 0 30px rgba(243,156,18,0.3);
  transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

.achievement.show {
  transform: translateX(-50%) translateY(0);
}

.achievement-icon { font-size: 32px; }

.achievement-info h3 {
  color: #f39c12;
  font-size: 14px;
}

.achievement-info p {
  color: rgba(255,255,255,0.6);
  font-size: 12px;
}

/* Result popup */
.result-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 300;
  backdrop-filter: blur(10px);
}

.result-popup.show { display: flex; }

.result-plushie {
  font-size: 100px;
  margin: 20px 0;
  animation: bounce-in 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes bounce-in {
  0% { transform: scale(0) rotate(-10deg); }
  50% { transform: scale(1.2) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

.result-title {
  font-size: 28px;
  color: #f39c12;
  margin-bottom: 8px;
}

.result-desc {
  color: rgba(255,255,255,0.6);
  margin-bottom: 24px;
}

.result-btn {
  padding: 14px 40px;
  background: #e74c3c;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(231,76,60,0.4);
}

/* Start screen */
.start-screen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 400;
  backdrop-filter: blur(20px);
}

.start-screen h1 {
  font-size: 48px;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #e74c3c, #f39c12, #e74c3c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% auto;
  animation: gradient-shift 3s linear infinite;
}

@keyframes gradient-shift {
  to { background-position: 200% center; }
}

.start-screen p {
  color: rgba(255,255,255,0.6);
  margin-bottom: 40px;
  text-align: center;
  line-height: 1.8;
}

.start-btn {
  padding: 18px 60px;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none;
  border-radius: 40px;
  color: white;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(231,76,60,0.4);
  transition: all 0.3s;
}

.start-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(231,76,60,0.5);
}
</style>
</head>
<body>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="loading-ring"></div>
  <div class="loading-text">加载 3D 场景...</div>
  <div class="loading-hint">正在构建游戏厅环境</div>
</div>

<!-- HUD -->
<div class="hud">
  <div class="top-bar">
    <div class="game-title">3D 抓娃娃机</div>
    <div class="stats">
      <div class="stat">
        <span>🪙</span>
        <span>得分</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span>⏱️</span>
        <span>时间</span>
        <span class="stat-value" id="timer">90</span>
      </div>
      <div class="stat">
        <span>🎯</span>
        <span>抓取</span>
        <span class="stat-value" id="catches">0</span>
      </div>
    </div>
  </div>

  <div class="gyro-indicator" id="gyro-indicator">
    <div class="gyro-dot"></div>
    <span>陀螺仪</span>
  </div>

  <div class="camera-hint">拖动屏幕旋转视角 · 滚轮缩放</div>

  <div class="crosshair"></div>

  <div class="instructions">
    <div class="instruction">
      <span class="key">←</span>
      <span class="key">→</span>
      <span>移动爪子</span>
    </div>
    <div class="instruction">
      <span class="key">空格</span>
      <span>抓取</span>
    </div>
  </div>

  <div class="controls">
    <div class="controls-row">
      <div class="joystick-area" id="joystick">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
      <button class="grab-btn" id="grab-btn">抓取</button>
    </div>
  </div>
</div>

<!-- Achievement -->
<div class="achievement" id="achievement">
  <div class="achievement-icon" id="achievement-icon">🎯</div>
  <div class="achievement-info">
    <h3 id="achievement-name">成就解锁</h3>
    <p id="achievement-desc">描述</p>
  </div>
</div>

<!-- Result -->
<div class="result-popup" id="result-popup">
  <div class="result-plushie" id="result-plushie">🧸</div>
  <div class="result-title" id="result-title">抓到了！</div>
  <div class="result-desc" id="result-desc">+15分</div>
  <button class="result-btn" id="result-btn">继续</button>
</div>

<!-- Start Screen -->
<div class="start-screen" id="start-screen">
  <h1>3D 抓娃娃机</h1>
  <p>
    沉浸式 3D 游戏厅体验<br>
    真实物理引擎 · 陀螺仪控制<br>
    收集所有娃娃成就
  </p>
  <button class="start-btn" id="start-btn">投币开始</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Game state
const state = {
  score: 0,
  time: 90,
  catches: 0,
  gameActive: false,
  clawX: 0,
  clawZ: 0,
  clawY: 0,
  isDropping: false,
  caughtToy: null,
  achievements: {},
  gyroEnabled: false
};

// Toy types
const TOY_TYPES = [
  { id: 'duck', color: 0xf1c40f, name: '小黄鸭', points: 10, emoji: '🦆' },
  { id: 'bear', color: 0xe67e22, name: '泰迪熊', points: 15, emoji: '🧸' },
  { id: 'panda', color: 0xecf0f1, name: '熊猫', points: 20, emoji: '🐼' },
  { id: 'bunny', color: 0xffb6c1, name: '兔兔', points: 15, emoji: '🐰' },
  { id: 'dino', color: 0x27ae60, name: '恐龙', points: 25, emoji: '🦕' },
  { id: 'penguin', color: 0x2c3e50, name: '企鹅', points: 20, emoji: '🐧' },
  { id: 'fox', color: 0xe74c3c, name: '狐狸', points: 15, emoji: '🦊' },
  { id: 'frog', color: 0x2ecc71, name: '青蛙', points: 10, emoji: '🐸' },
  { id: 'whale', color: 0x3498db, name: '鲸鱼', points: 30, emoji: '🐳' },
  { id: 'cat', color: 0x9b59b6, name: '猫咪', points: 15, emoji: '🐱' },
  { id: 'puppy', color: 0xf39c12, name: '小狗', points: 15, emoji: '🐶' },
  { id: 'unicorn', color: 0xff6b9d, name: '独角兽', points: 50, emoji: '🦄' }
];

// Achievements
const ACHIEVEMENTS = [
  { id: 'first', name: '初次抓取', desc: '成功抓到第一个娃娃', icon: '🎯', condition: () => state.catches >= 1 },
  { id: 'catch5', name: '抓取新手', desc: '累计抓到5个娃娃', icon: '🥉', condition: () => state.catches >= 5 },
  { id: 'catch10', name: '抓取达人', desc: '累计抓到10个娃娃', icon: '🥈', condition: () => state.catches >= 10 },
  { id: 'score100', name: '百分选手', desc: '得分超过100', icon: '💯', condition: () => state.score >= 100 },
  { id: 'score500', name: '高分玩家', desc: '得分超过500', icon: '⭐', condition: () => state.score >= 500 }
];

// Three.js setup
let scene, camera, renderer, controls, clock;
let claw, clawFingers, toys = [];
let room, arcadeMachines = [];

// Canvas
const canvas = document.getElementById('canvas');

// Initialize
function init() {
  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.FogExp2(0x0a0a1a, 0.05);
  
  // Camera
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 4);
  
  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  
  // Controls
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2;
  controls.minDistance = 2;
  controls.maxDistance = 8;
  controls.target.set(0, 1, 0);
  
  // Clock
  clock = new THREE.Clock();
  
  // Create scene
  createRoom();
  createClawMachine();
  createToys();
  createArcadeMachines();
  createLights();
  
  // Hide loading
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 2000);
}

// Create room
function createRoom() {
  // Floor
  const floorGeometry = new THREE.PlaneGeometry(20, 20);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    roughness: 0.8,
    metalness: 0.2
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  
  // Checkered pattern
  const checkGeometry = new THREE.PlaneGeometry(20, 20, 20, 20);
  const checkMaterial = new THREE.MeshStandardMaterial({
    color: 0x0f0f23,
    roughness: 0.9,
    metalness: 0.1
  });
  const check = new THREE.Mesh(checkGeometry, checkMaterial);
  check.rotation.x = -Math.PI / 2;
  check.position.y = 0.01;
  check.receiveShadow = true;
  scene.add(check);
  
  // Walls
  const wallMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1a3a,
    roughness: 0.9,
    metalness: 0.1
  });
  
  // Back wall
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), wallMaterial);
  backWall.position.set(0, 3, -10);
  backWall.receiveShadow = true;
  scene.add(backWall);
  
  // Side walls
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), wallMaterial);
  leftWall.rotation.y = Math.PI / 2;
  leftWall.position.set(-10, 3, 0);
  leftWall.receiveShadow = true;
  scene.add(leftWall);
  
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), wallMaterial);
  rightWall.rotation.y = -Math.PI / 2;
  rightWall.position.set(10, 3, 0);
  rightWall.receiveShadow = true;
  scene.add(rightWall);
  
  // Ceiling
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), wallMaterial);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = 6;
  scene.add(ceiling);
  
  // Neon strips on ceiling
  const neonGeometry = new THREE.BoxGeometry(18, 0.1, 0.1);
  const neonMaterial = new THREE.MeshStandardMaterial({
    color: 0xe74c3c,
    emissive: 0xe74c3c,
    emissiveIntensity: 2
  });
  
  for (let i = 0; i < 3; i++) {
    const neon = new THREE.Mesh(neonGeometry, neonMaterial);
    neon.position.set(0, 5.9, -5 + i * 5);
    scene.add(neon);
  }
}

// Create claw machine
function createClawMachine() {
  const machineGroup = new THREE.Group();
  
  // Base
  const baseGeometry = new THREE.BoxGeometry(2.5, 0.3, 2.5);
  const baseMaterial = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    metalness: 0.8,
    roughness: 0.2
  });
  const base = new THREE.Mesh(baseGeometry, baseMaterial);
  base.position.y = 0.15;
  base.castShadow = true;
  base.receiveShadow = true;
  machineGroup.add(base);
  
  // Glass
  const glassGeometry = new THREE.BoxGeometry(2.5, 2, 2.5);
  const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x88ccff,
    transparent: true,
    opacity: 0.1,
    roughness: 0,
    metalness: 0,
    transmission: 0.95,
    thickness: 0.1
  });
  const glass = new THREE.Mesh(glassGeometry, glassMaterial);
  glass.position.y = 1.3;
  machineGroup.add(glass);
  
  // Metal frame
  const frameMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  
  // Vertical frames
  for (let i = 0; i < 4; i++) {
    const frameGeometry = new THREE.CylinderGeometry(0.03, 0.03, 2);
    const frame = new THREE.Mesh(frameGeometry, frameMaterial);
    const x = (i % 2 === 0 ? -1 : 1) * 1.25;
    const z = (i < 2 ? -1 : 1) * 1.25;
    frame.position.set(x, 1.3, z);
    frame.castShadow = true;
    machineGroup.add(frame);
  }
  
  // Top
  const topGeometry = new THREE.BoxGeometry(2.7, 0.2, 2.7);
  const topMaterial = new THREE.MeshStandardMaterial({
    color: 0xe74c3c,
    metalness: 0.3,
    roughness: 0.7
  });
  const top = new THREE.Mesh(topGeometry, topMaterial);
  top.position.y = 2.4;
  top.castShadow = true;
  machineGroup.add(top);
  
  // Lights on top
  for (let i = 0; i < 8; i++) {
    const lightGeometry = new THREE.SphereGeometry(0.06, 16, 16);
    const lightMaterial = new THREE.MeshStandardMaterial({
      color: 0xf39c12,
      emissive: 0xf39c12,
      emissiveIntensity: 3
    });
    const light = new THREE.Mesh(lightGeometry, lightMaterial);
    const angle = (i / 8) * Math.PI * 2;
    light.position.set(Math.cos(angle) * 1.1, 2.5, Math.sin(angle) * 1.1);
    machineGroup.add(light);
  }
  
  // Floor inside
  const floorGeometry = new THREE.PlaneGeometry(2.3, 2.3);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x2c3e50,
    roughness: 0.8
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.31;
  floor.receiveShadow = true;
  machineGroup.add(floor);
  
  // Prize chute
  const chuteGeometry = new THREE.BoxGeometry(0.6, 0.5, 0.2);
  const chuteMaterial = new THREE.MeshStandardMaterial({
    color: 0x2c3e50,
    metalness: 0.5,
    roughness: 0.5
  });
  const chute = new THREE.Mesh(chuteGeometry, chuteMaterial);
  chute.position.set(0, 0.5, 1.35);
  machineGroup.add(chute);
  
  // Claw
  claw = new THREE.Group();
  
  // Rail
  const railGeometry = new THREE.BoxGeometry(2.3, 0.04, 0.04);
  const rail = new THREE.Mesh(railGeometry, frameMaterial);
  rail.position.y = 2.2;
  claw.add(rail);
  
  // Carriage
  const carriageGeometry = new THREE.BoxGeometry(0.25, 0.12, 0.25);
  const carriage = new THREE.Mesh(carriageGeometry, frameMaterial);
  carriage.position.y = 2.1;
  claw.add(carriage);
  
  // Wire
  const wireGeometry = new THREE.CylinderGeometry(0.008, 0.008, 0.8);
  const wireMaterial = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });
  const wire = new THREE.Mesh(wireGeometry, wireMaterial);
  wire.position.y = 1.7;
  claw.add(wire);
  
  // Claw head
  clawFingers = new THREE.Group();
  clawFingers.position.y = 1.3;
  
  const fingerMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  
  for (let i = 0; i < 3; i++) {
    const fingerGeometry = new THREE.BoxGeometry(0.03, 0.3, 0.03);
    const finger = new THREE.Mesh(fingerGeometry, fingerMaterial);
    const angle = (i / 3) * Math.PI * 2;
    finger.position.set(Math.cos(angle) * 0.08, -0.15, Math.sin(angle) * 0.08);
    finger.rotation.z = Math.cos(angle) * 0.3;
    finger.rotation.x = Math.sin(angle) * 0.3;
    finger.castShadow = true;
    clawFingers.add(finger);
  }
  
  claw.add(clawFingers);
  machineGroup.add(claw);
  
  scene.add(machineGroup);
}

// Create toys
function createToys() {
  toys.forEach(toy => scene.remove(toy));
  toys = [];
  
  const toyCount = 15;
  
  for (let i = 0; i < toyCount; i++) {
    const toyType = TOY_TYPES[Math.floor(Math.random() * TOY_TYPES.length)];
    
    const bodyGeometry = new THREE.SphereGeometry(0.15, 32, 32);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: toyType.color,
      roughness: 0.8,
      metalness: 0.1
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    
    const eyeGeometry = new THREE.SphereGeometry(0.03, 16, 16);
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
    
    const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    leftEye.position.set(-0.04, 0.04, 0.13);
    
    const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    rightEye.position.set(0.04, 0.04, 0.13);
    
    const toy = new THREE.Group();
    toy.add(body);
    toy.add(leftEye);
    toy.add(rightEye);
    
    toy.position.set(
      (Math.random() - 0.5) * 1.8,
      0.45,
      (Math.random() - 0.5) * 1.8
    );
    
    toy.rotation.y = Math.random() * Math.PI * 2;
    toy.castShadow = true;
    toy.userData = { type: toyType, id: i };
    
    scene.add(toy);
    toys.push(toy);
  }
}

// Create arcade machines
function createArcadeMachines() {
  const machineColors = [0x2c3e50, 0x34495e, 0x1a1a3a, 0x2a2a4a];
  
  for (let i = 0; i < 6; i++) {
    const machineGroup = new THREE.Group();
    
    const bodyGeometry = new THREE.BoxGeometry(0.8, 1.5, 0.6);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: machineColors[i % machineColors.length],
      metalness: 0.5,
      roughness: 0.5
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.position.y = 0.75;
    body.castShadow = true;
    body.receiveShadow = true;
    machineGroup.add(body);
    
    const screenGeometry = new THREE.PlaneGeometry(0.6, 0.4);
    const screenMaterial = new THREE.MeshStandardMaterial({
      color: 0x00ff00,
      emissive: 0x00ff00,
      emissiveIntensity: 0.5
    });
    const screen = new THREE.Mesh(screenGeometry, screenMaterial);
    screen.position.set(0, 1.2, 0.31);
    machineGroup.add(screen);
    
    const angle = (i / 6) * Math.PI * 2;
    const radius = 4;
    machineGroup.position.set(
      Math.cos(angle) * radius,
      0,
      Math.sin(angle) * radius
    );
    machineGroup.rotation.y = -angle + Math.PI;
    
    scene.add(machineGroup);
    arcadeMachines.push(machineGroup);
  }
}

// Create lights
function createLights() {
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
  directionalLight.position.set(5, 10, 5);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 2048;
  directionalLight.shadow.mapSize.height = 2048;
  scene.add(directionalLight);
  
  const pointLight1 = new THREE.PointLight(0xe74c3c, 2, 10);
  pointLight1.position.set(0, 4, 0);
  scene.add(pointLight1);
  
  const pointLight2 = new THREE.PointLight(0xf39c12, 2, 10);
  pointLight2.position.set(2, 3, 2);
  scene.add(pointLight2);
  
  const pointLight3 = new THREE.PointLight(0x4ecdc4, 1, 8);
  pointLight3.position.set(-3, 2, -2);
  scene.add(pointLight3);
}

// Update claw
function updateClaw() {
  claw.position.x = state.clawX;
  claw.position.z = state.clawZ;
  
  const wire = claw.children[2];
  wire.scale.y = 1 + state.clawY;
  wire.position.y = 1.7 - state.clawY / 2;
  
  clawFingers.position.y = 1.3 - state.clawY;
}

// Move claw
function moveClaw(dx, dz) {
  if (!state.gameActive || state.isDropping) return;
  
  state.clawX = Math.max(-0.9, Math.min(0.9, state.clawX + dx * 0.03));
  state.clawZ = Math.max(-0.9, Math.min(0.9, state.clawZ + dz * 0.03));
  
  updateClaw();
}

// Drop claw
function dropClaw() {
  if (!state.gameActive || state.isDropping) return;
  
  state.isDropping = true;
  
  const dropInterval = setInterval(() => {
    state.clawY += 0.03;
    updateClaw();
    
    if (state.clawY >= 0.8) {
      clearInterval(dropInterval);
      checkGrab();
    }
  }, 20);
}

// Check grab
function checkGrab() {
  let grabbedToy = null;
  let minDistance = 0.4;
  
  toys.forEach(toy => {
    if (!toy.visible) return;
    
    const distance = Math.sqrt(
      Math.pow(state.clawX - toy.position.x, 2) +
      Math.pow(state.clawZ - toy.position.z, 2)
    );
    
    if (distance < minDistance) {
      minDistance = distance;
      grabbedToy = toy;
    }
  });
  
  if (grabbedToy && Math.random() > 0.25) {
    state.caughtToy = grabbedToy.userData.type;
    grabbedToy.visible = false;
    state.score += grabbedToy.userData.type.points;
    state.catches++;
    
    document.getElementById('score').textContent = state.score;
    document.getElementById('catches').textContent = state.catches;
  }
  
  setTimeout(() => {
    const retractInterval = setInterval(() => {
      state.clawY -= 0.03;
      updateClaw();
      
      if (state.clawY <= 0) {
        clearInterval(retractInterval);
        state.isDropping = false;
        
        if (state.caughtToy) {
          showResult(state.caughtToy);
          checkAchievements();
          state.caughtToy = null;
        }
      }
    }, 20);
  }, 500);
}

// Show result
function showResult(toy) {
  document.getElementById('result-plushie').textContent = toy.emoji;
  document.getElementById('result-title').textContent = `抓到了 ${toy.name}！`;
  document.getElementById('result-desc').textContent = `+${toy.points}分`;
  document.getElementById('result-popup').classList.add('show');
}

// Check achievements
function checkAchievements() {
  ACHIEVEMENTS.forEach(ach => {
    if (!state.achievements[ach.id] && ach.condition()) {
      state.achievements[ach.id] = true;
      showAchievement(ach);
    }
  });
}

// Show achievement
function showAchievement(ach) {
  document.getElementById('achievement-icon').textContent = ach.icon;
  document.getElementById('achievement-name').textContent = ach.name;
  document.getElementById('achievement-desc').textContent = ach.desc;
  document.getElementById('achievement').classList.add('show');
  
  setTimeout(() => {
    document.getElementById('achievement').classList.remove('show');
  }, 3000);
}

// Timer
function startTimer() {
  const timerInterval = setInterval(() => {
    if (!state.gameActive) {
      clearInterval(timerInterval);
      return;
    }
    
    state.time--;
    document.getElementById('timer').textContent = state.time;
    
    if (state.time <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

// Start game
function startGame() {
  state.score = 0;
  state.time = 90;
  state.catches = 0;
  state.gameActive = true;
  state.clawX = 0;
  state.clawZ = 0;
  state.clawY = 0;
  
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = '90';
  document.getElementById('catches').textContent = '0';
  document.getElementById('start-screen').style.display = 'none';
  
  createToys();
  updateClaw();
  startTimer();
}

// End game
function endGame() {
  state.gameActive = false;
  
  document.getElementById('result-plushie').textContent = '🎮';
  document.getElementById('result-title').textContent = '游戏结束';
  document.getElementById('result-desc').textContent = `最终得分：${state.score} | 抓取：${state.catches}个`;
  document.getElementById('result-btn').textContent = '再来一次';
  document.getElementById('result-popup').classList.add('show');
}

// Gyroscope
function initGyroscope() {
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      if (!state.gyroEnabled || !state.gameActive) return;
      
      const gamma = e.gamma;
      const beta = e.beta;
      
      if (gamma !== null && beta !== null) {
        state.clawX = (gamma / 45) * 0.9;
        state.clawZ = ((beta - 45) / 45) * 0.9;
        updateClaw();
      }
    });
    
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.getElementById('start-btn').addEventListener('click', async () => {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          state.gyroEnabled = true;
          document.getElementById('gyro-indicator').style.display = 'flex';
        }
      });
    } else {
      state.gyroEnabled = true;
      document.getElementById('gyro-indicator').style.display = 'flex';
    }
  }
}

// Joystick
function initJoystick() {
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  let startX = 0, startY = 0;
  
  joystick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  
  joystick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    const maxDist = 40;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const clampedDx = dist > maxDist ? (dx / dist) * maxDist : dx;
    const clampedDy = dist > maxDist ? (dy / dist) * maxDist : dy;
    
    knob.style.transform = `translate(calc(-50% + ${clampedDx}px), calc(-50% + ${clampedDy}px))`;
    
    moveClaw(clampedDx / maxDist, clampedDy / maxDist);
  });
  
  joystick.addEventListener('touchend', () => {
    knob.style.transform = 'translate(-50%, -50%)';
  });
}

// Keyboard
function initKeyboard() {
  const keys = {};
  
  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      dropClaw();
    }
  });
  
  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });
  
  function gameLoop() {
    if (keys['ArrowLeft'] || keys['a']) moveClaw(-1, 0);
    if (keys['ArrowRight'] || keys['d']) moveClaw(1, 0);
    if (keys['ArrowUp'] || keys['w']) moveClaw(0, -1);
    if (keys['ArrowDown'] || keys['s']) moveClaw(0, 1);
    requestAnimationFrame(gameLoop);
  }
  
  gameLoop();
}

// Event listeners
document.getElementById('grab-btn').addEventListener('click', dropClaw);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('result-btn').addEventListener('click', () => {
  document.getElementById('result-popup').classList.remove('show');
  if (state.time <= 0) startGame();
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  
  controls.update();
  
  toys.forEach((toy, i) => {
    if (toy.visible) {
      toy.rotation.y += delta * 0.5;
      toy.position.y = 0.45 + Math.sin(Date.now() * 0.001 + i) * 0.03;
    }
  });
  
  renderer.render(scene, camera);
}

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initialize
init();
initJoystick();
initKeyboard();
initGyroscope();
animate();
</script>
