<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 抓娃娃机</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a1a;
  color: #fff;
  overflow: hidden;
  height: 100vh;
  touch-action: none;
}

/* Loading screen */
.loading {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f0f23, #1a1a3a);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #e74c3c;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  margin-top: 20px;
  font-size: 18px;
  color: rgba(255,255,255,0.6);
}

/* Game UI overlay */
.game-ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

.game-ui > * {
  pointer-events: auto;
}

/* Header */
.header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 16px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(90deg, #e74c3c, #f39c12);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stats {
  display: flex;
  gap: 20px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.stat-value {
  font-weight: 700;
  color: #f39c12;
  font-size: 18px;
}

/* Controls */
.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
}

.controls-row {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 400px;
  margin: 0 auto;
}

/* Joystick */
.joystick-area {
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  position: relative;
  cursor: pointer;
}

.joystick-knob {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  background: radial-gradient(circle, #e74c3c, #c0392b);
  border-radius: 50%;
  box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
  transition: transform 0.1s;
}

/* Grab button */
.grab-btn {
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, #e74c3c, #c0392b);
  border: 4px solid #96281b;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 
    0 6px 0 #96281b,
    0 8px 20px rgba(231, 76, 60, 0.4);
  transition: all 0.1s;
  letter-spacing: 2px;
}

.grab-btn:hover {
  transform: translateY(-2px);
  box-shadow: 
    0 8px 0 #96281b,
    0 10px 30px rgba(231, 76, 60, 0.5);
}

.grab-btn:active {
  transform: translateY(4px);
  box-shadow: 
    0 2px 0 #96281b,
    0 4px 10px rgba(231, 76, 60, 0.3);
}

/* Gyroscope indicator */
.gyro-indicator {
  position: absolute;
  top: 80px;
  right: 20px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.gyro-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2ecc71;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Achievement popup */
.achievement {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(135deg, #2c2c3e, #1a1a2e);
  border: 2px solid #f39c12;
  border-radius: 12px;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 200;
  box-shadow: 0 0 30px rgba(243, 156, 18, 0.3);
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.achievement.show {
  transform: translateX(-50%) translateY(0);
}

.achievement-icon {
  font-size: 32px;
}

.achievement-info h3 {
  color: #f39c12;
  font-size: 14px;
}

.achievement-info p {
  color: rgba(255,255,255,0.6);
  font-size: 12px;
}

/* Result popup */
.result-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 300;
  backdrop-filter: blur(10px);
}

.result-popup.show {
  display: flex;
}

.result-plushie {
  font-size: 100px;
  margin: 20px 0;
  animation: bounce-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes bounce-in {
  0% { transform: scale(0) rotate(-10deg); }
  50% { transform: scale(1.2) rotate(5deg); }
  100% { transform: scale(1) rotate(0); }
}

.result-title {
  font-size: 28px;
  color: #f39c12;
  margin-bottom: 8px;
}

.result-desc {
  color: rgba(255,255,255,0.6);
  margin-bottom: 24px;
}

.result-btn {
  padding: 14px 40px;
  background: #e74c3c;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
  transition: transform 0.2s;
}

.result-btn:hover {
  transform: scale(1.05);
}

/* Start screen */
.start-screen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 400;
  backdrop-filter: blur(20px);
}

.start-screen h1 {
  font-size: 48px;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #e74c3c, #f39c12, #e74c3c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% auto;
  animation: gradient-shift 3s linear infinite;
}

@keyframes gradient-shift {
  to { background-position: 200% center; }
}

.start-screen p {
  color: rgba(255,255,255,0.6);
  margin-bottom: 40px;
  text-align: center;
  line-height: 1.8;
}

.start-btn {
  padding: 18px 60px;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none;
  border-radius: 40px;
  color: white;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
  transition: all 0.3s;
}

.start-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(231, 76, 60, 0.5);
}

/* Instructions */
.instructions {
  position: absolute;
  bottom: 180px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 24px;
  font-size: 12px;
  color: rgba(255,255,255,0.4);
}

.instruction {
  display: flex;
  align-items: center;
  gap: 6px;
}

.key {
  background: rgba(255,255,255,0.1);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
  font-family: monospace;
}

/* Camera controls hint */
.camera-hint {
  position: absolute;
  bottom: 180px;
  left: 20px;
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载 3D 场景...</div>
</div>

<!-- Game UI -->
<div class="game-ui">
  <!-- Header -->
  <div class="header">
    <div class="title">3D 抓娃娃机</div>
    <div class="stats">
      <div class="stat">
        <span>🪙</span>
        <span>得分</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span>⏱️</span>
        <span>时间</span>
        <span class="stat-value" id="timer">90</span>
      </div>
      <div class="stat">
        <span>🎯</span>
        <span>抓取</span>
        <span class="stat-value" id="catches">0</span>
      </div>
    </div>
  </div>

  <!-- Gyroscope Indicator -->
  <div class="gyro-indicator" id="gyro-indicator" style="display:none">
    <div class="gyro-dot"></div>
    <span>陀螺仪</span>
  </div>

  <!-- Camera Hint -->
  <div class="camera-hint">拖动屏幕旋转视角</div>

  <!-- Instructions -->
  <div class="instructions">
    <div class="instruction">
      <span class="key">←</span>
      <span class="key">→</span>
      <span>移动爪子</span>
    </div>
    <div class="instruction">
      <span class="key">空格</span>
      <span>抓取</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-row">
      <div class="joystick-area" id="joystick">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
      <button class="grab-btn" id="grab-btn">抓取</button>
    </div>
  </div>
</div>

<!-- Achievement Popup -->
<div class="achievement" id="achievement">
  <div class="achievement-icon" id="achievement-icon">🎯</div>
  <div class="achievement-info">
    <h3 id="achievement-name">成就解锁</h3>
    <p id="achievement-desc">描述</p>
  </div>
</div>

<!-- Result Popup -->
<div class="result-popup" id="result-popup">
  <div class="result-plushie" id="result-plushie">🧸</div>
  <div class="result-title" id="result-title">抓到了！</div>
  <div class="result-desc" id="result-desc">+15分</div>
  <button class="result-btn" id="result-btn">继续</button>
</div>

<!-- Start Screen -->
<div class="start-screen" id="start-screen">
  <h1>3D 抓娃娃机</h1>
  <p>
    真实 3D 物理引擎<br>
    移动端陀螺仪控制<br>
    收集所有娃娃成就
  </p>
  <button class="start-btn" id="start-btn">投币开始</button>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Game state
const state = {
  score: 0,
  time: 90,
  catches: 0,
  gameActive: false,
  clawX: 0,
  clawZ: 0,
  clawY: 0,
  isDropping: false,
  isGrabbing: false,
  caughtToy: null,
  achievements: {},
  gyroEnabled: false,
  cameraAngle: { x: 0.3, y: -0.5 }
};

// Toy types
const TOY_TYPES = [
  { id: 'duck', color: 0xf1c40f, name: '小黄鸭', points: 10, emoji: '🦆' },
  { id: 'bear', color: 0xe67e22, name: '泰迪熊', points: 15, emoji: '🧸' },
  { id: 'panda', color: 0xecf0f1, name: '熊猫', points: 20, emoji: '🐼' },
  { id: 'bunny', color: 0xffb6c1, name: '兔兔', points: 15, emoji: '🐰' },
  { id: 'dino', color: 0x27ae60, name: '恐龙', points: 25, emoji: '🦕' },
  { id: 'penguin', color: 0x2c3e50, name: '企鹅', points: 20, emoji: '🐧' },
  { id: 'fox', color: 0xe74c3c, name: '狐狸', points: 15, emoji: '🦊' },
  { id: 'frog', color: 0x2ecc71, name: '青蛙', points: 10, emoji: '🐸' },
  { id: 'whale', color: 0x3498db, name: '鲸鱼', points: 30, emoji: '🐳' },
  { id: 'cat', color: 0x9b59b6, name: '猫咪', points: 15, emoji: '🐱' },
  { id: 'puppy', color: 0xf39c12, name: '小狗', points: 15, emoji: '🐶' },
  { id: 'unicorn', color: 0xff6b9d, name: '独角兽', points: 50, emoji: '🦄' }
];

// Achievements
const ACHIEVEMENTS = [
  { id: 'first', name: '初次抓取', desc: '成功抓到第一个娃娃', icon: '🎯', condition: () => state.catches >= 1 },
  { id: 'catch5', name: '抓取新手', desc: '累计抓到5个娃娃', icon: '🥉', condition: () => state.catches >= 5 },
  { id: 'catch10', name: '抓取达人', desc: '累计抓到10个娃娃', icon: '🥈', condition: () => state.catches >= 10 },
  { id: 'score100', name: '百分选手', desc: '得分超过100', icon: '💯', condition: () => state.score >= 100 },
  { id: 'score500', name: '高分玩家', desc: '得分超过500', icon: '⭐', condition: () => state.score >= 500 }
];

// Three.js setup
let scene, camera, renderer, clock;
let claw, clawFingers, toys = [];
let raycaster, mouse;

// Initialize Three.js
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 10, 30);
  
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3, 5);
  camera.lookAt(0, 1, 0);
  
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  renderer.domElement.style.position = 'fixed';
  renderer.domElement.style.inset = '0';
  renderer.domElement.style.zIndex = '0';
  
  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  
  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 10, 5);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 2048;
  directionalLight.shadow.mapSize.height = 2048;
  scene.add(directionalLight);
  
  const pointLight1 = new THREE.PointLight(0xe74c3c, 1, 10);
  pointLight1.position.set(-2, 3, 0);
  scene.add(pointLight1);
  
  const pointLight2 = new THREE.PointLight(0xf39c12, 1, 10);
  pointLight2.position.set(2, 3, 0);
  scene.add(pointLight2);
  
  // Create machine
  createMachine();
  
  // Create claw
  createClaw();
  
  // Create toys
  createToys();
  
  // Hide loading
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 1000);
}

// Create claw machine
function createMachine() {
  // Base
  const baseGeometry = new THREE.BoxGeometry(3, 0.2, 3);
  const baseMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x1a1a2e,
    metalness: 0.8,
    roughness: 0.2
  });
  const base = new THREE.Mesh(baseGeometry, baseMaterial);
  base.position.y = 0.1;
  base.receiveShadow = true;
  scene.add(base);
  
  // Glass walls
  const glassGeometry = new THREE.BoxGeometry(3, 2.5, 3);
  const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x88ccff,
    transparent: true,
    opacity: 0.15,
    roughness: 0,
    metalness: 0,
    transmission: 0.9,
    thickness: 0.1
  });
  const glass = new THREE.Mesh(glassGeometry, glassMaterial);
  glass.position.y = 1.45;
  scene.add(glass);
  
  // Metal frame
  const frameMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  
  // Vertical frames
  for (let i = 0; i < 4; i++) {
    const frameGeometry = new THREE.CylinderGeometry(0.03, 0.03, 2.5);
    const frame = new THREE.Mesh(frameGeometry, frameMaterial);
    const x = (i % 2 === 0 ? -1 : 1) * 1.5;
    const z = (i < 2 ? -1 : 1) * 1.5;
    frame.position.set(x, 1.45, z);
    frame.castShadow = true;
    scene.add(frame);
  }
  
  // Top frame
  const topFrameGeometry = new THREE.BoxGeometry(3.2, 0.1, 3.2);
  const topFrame = new THREE.Mesh(topFrameGeometry, frameMaterial);
  topFrame.position.y = 2.75;
  topFrame.castShadow = true;
  scene.add(topFrame);
  
  // Red top
  const topGeometry = new THREE.BoxGeometry(3.4, 0.3, 3.4);
  const topMaterial = new THREE.MeshStandardMaterial({
    color: 0xe74c3c,
    metalness: 0.3,
    roughness: 0.7
  });
  const top = new THREE.Mesh(topGeometry, topMaterial);
  top.position.y = 3.0;
  top.castShadow = true;
  scene.add(top);
  
  // Lights on top
  for (let i = 0; i < 8; i++) {
    const lightGeometry = new THREE.SphereGeometry(0.08, 16, 16);
    const lightMaterial = new THREE.MeshStandardMaterial({
      color: 0xf39c12,
      emissive: 0xf39c12,
      emissiveIntensity: 2
    });
    const light = new THREE.Mesh(lightGeometry, lightMaterial);
    const angle = (i / 8) * Math.PI * 2;
    light.position.set(Math.cos(angle) * 1.4, 3.15, Math.sin(angle) * 1.4);
    scene.add(light);
  }
  
  // Floor inside machine
  const floorGeometry = new THREE.PlaneGeometry(2.8, 2.8);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x2c3e50,
    roughness: 0.8
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.21;
  floor.receiveShadow = true;
  scene.add(floor);
  
  // Prize chute
  const chuteGeometry = new THREE.BoxGeometry(0.8, 0.6, 0.3);
  const chuteMaterial = new THREE.MeshStandardMaterial({
    color: 0x2c3e50,
    metalness: 0.5,
    roughness: 0.5
  });
  const chute = new THREE.Mesh(chuteGeometry, chuteMaterial);
  chute.position.set(0, 0.5, 1.65);
  scene.add(chute);
}

// Create claw
function createClaw() {
  claw = new THREE.Group();
  
  // Rail
  const railGeometry = new THREE.BoxGeometry(2.8, 0.05, 0.05);
  const railMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  const rail = new THREE.Mesh(railGeometry, railMaterial);
  rail.position.y = 2.6;
  claw.add(rail);
  
  // Carriage
  const carriageGeometry = new THREE.BoxGeometry(0.3, 0.15, 0.3);
  const carriageMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  const carriage = new THREE.Mesh(carriageGeometry, carriageMaterial);
  carriage.position.y = 2.5;
  claw.add(carriage);
  
  // Wire
  const wireGeometry = new THREE.CylinderGeometry(0.01, 0.01, 1);
  const wireMaterial = new THREE.MeshStandardMaterial({ color: 0x95a5a6 });
  const wire = new THREE.Mesh(wireGeometry, wireMaterial);
  wire.position.y = 2.0;
  claw.add(wire);
  
  // Claw head
  clawFingers = new THREE.Group();
  clawFingers.position.y = 1.5;
  
  const fingerMaterial = new THREE.MeshStandardMaterial({
    color: 0xbdc3c7,
    metalness: 0.9,
    roughness: 0.1
  });
  
  // Three fingers
  for (let i = 0; i < 3; i++) {
    const fingerGeometry = new THREE.BoxGeometry(0.04, 0.4, 0.04);
    const finger = new THREE.Mesh(fingerGeometry, fingerMaterial);
    const angle = (i / 3) * Math.PI * 2;
    finger.position.set(Math.cos(angle) * 0.1, -0.2, Math.sin(angle) * 0.1);
    finger.rotation.z = Math.cos(angle) * 0.3;
    finger.rotation.x = Math.sin(angle) * 0.3;
    finger.castShadow = true;
    clawFingers.add(finger);
  }
  
  claw.add(clawFingers);
  scene.add(claw);
}

// Create toys
function createToys() {
  // Clear existing toys
  toys.forEach(toy => scene.remove(toy));
  toys = [];
  
  const toyCount = 15;
  
  for (let i = 0; i < toyCount; i++) {
    const toyType = TOY_TYPES[Math.floor(Math.random() * TOY_TYPES.length)];
    
    // Body
    const bodyGeometry = new THREE.SphereGeometry(0.2, 32, 32);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: toyType.color,
      roughness: 0.8,
      metalness: 0.1
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    
    // Eyes
    const eyeGeometry = new THREE.SphereGeometry(0.04, 16, 16);
    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
    
    const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    leftEye.position.set(-0.06, 0.06, 0.18);
    
    const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    rightEye.position.set(0.06, 0.06, 0.18);
    
    // Group
    const toy = new THREE.Group();
    toy.add(body);
    toy.add(leftEye);
    toy.add(rightEye);
    
    // Random position
    toy.position.set(
      (Math.random() - 0.5) * 2,
      0.4,
      (Math.random() - 0.5) * 2
    );
    
    toy.rotation.y = Math.random() * Math.PI * 2;
    toy.castShadow = true;
    toy.userData = { type: toyType, id: i };
    
    scene.add(toy);
    toys.push(toy);
  }
}

// Update claw position
function updateClaw() {
  claw.position.x = state.clawX;
  claw.position.z = state.clawZ;
  
  // Update wire length
  const wire = claw.children[2];
  wire.scale.y = 1 + state.clawY;
  wire.position.y = 2.0 - state.clawY / 2;
  
  // Update claw head position
  clawFingers.position.y = 1.5 - state.clawY;
}

// Move claw
function moveClaw(dx, dz) {
  if (!state.gameActive || state.isDropping) return;
  
  state.clawX = Math.max(-1.2, Math.min(1.2, state.clawX + dx * 0.05));
  state.clawZ = Math.max(-1.2, Math.min(1.2, state.clawZ + dz * 0.05));
  
  updateClaw();
}

// Drop claw
function dropClaw() {
  if (!state.gameActive || state.isDropping) return;
  
  state.isDropping = true;
  state.isGrabbing = true;
  
  // Animate dropping
  const dropInterval = setInterval(() => {
    state.clawY += 0.05;
    updateClaw();
    
    // Close fingers as dropping
    clawFingers.children.forEach(finger => {
      finger.rotation.z *= 0.95;
      finger.rotation.x *= 0.95;
    });
    
    if (state.clawY >= 1.0) {
      clearInterval(dropInterval);
      checkGrab();
    }
  }, 20);
}

// Check grab
function checkGrab() {
  let grabbedToy = null;
  let minDistance = 0.5;
  
  toys.forEach(toy => {
    if (!toy.visible) return;
    
    const distance = Math.sqrt(
      Math.pow(state.clawX - toy.position.x, 2) +
      Math.pow(state.clawZ - toy.position.z, 2)
    );
    
    if (distance < minDistance) {
      minDistance = distance;
      grabbedToy = toy;
    }
  });
  
  if (grabbedToy && Math.random() > 0.3) {
    state.caughtToy = grabbedToy.userData.type;
    grabbedToy.visible = false;
    state.score += grabbedToy.userData.type.points;
    state.catches++;
    
    document.getElementById('score').textContent = state.score;
    document.getElementById('catches').textContent = state.catches;
  }
  
  // Retract
  setTimeout(() => {
    const retractInterval = setInterval(() => {
      state.clawY -= 0.05;
      updateClaw();
      
      if (state.clawY <= 0) {
        clearInterval(retractInterval);
        state.isDropping = false;
        state.isGrabbing = false;
        
        if (state.caughtToy) {
          showResult(state.caughtToy);
          checkAchievements();
          state.caughtToy = null;
        }
      }
    }, 20);
  }, 500);
}

// Show result
function showResult(toy) {
  document.getElementById('result-plushie').textContent = toy.emoji;
  document.getElementById('result-title').textContent = `抓到了 ${toy.name}！`;
  document.getElementById('result-desc').textContent = `+${toy.points}分`;
  document.getElementById('result-popup').classList.add('show');
}

// Check achievements
function checkAchievements() {
  ACHIEVEMENTS.forEach(ach => {
    if (!state.achievements[ach.id] && ach.condition()) {
      state.achievements[ach.id] = true;
      showAchievement(ach);
    }
  });
}

// Show achievement
function showAchievement(ach) {
  document.getElementById('achievement-icon').textContent = ach.icon;
  document.getElementById('achievement-name').textContent = ach.name;
  document.getElementById('achievement-desc').textContent = ach.desc;
  document.getElementById('achievement').classList.add('show');
  
  setTimeout(() => {
    document.getElementById('achievement').classList.remove('show');
  }, 3000);
}

// Timer
function startTimer() {
  const timerInterval = setInterval(() => {
    if (!state.gameActive) {
      clearInterval(timerInterval);
      return;
    }
    
    state.time--;
    document.getElementById('timer').textContent = state.time;
    
    if (state.time <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

// Start game
function startGame() {
  state.score = 0;
  state.time = 90;
  state.catches = 0;
  state.gameActive = true;
  state.clawX = 0;
  state.clawZ = 0;
  state.clawY = 0;
  
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = '90';
  document.getElementById('catches').textContent = '0';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result-popup').classList.remove('show');
  
  createToys();
  updateClaw();
  startTimer();
}

// End game
function endGame() {
  state.gameActive = false;
  
  document.getElementById('result-plushie').textContent = '🎮';
  document.getElementById('result-title').textContent = '游戏结束';
  document.getElementById('result-desc').textContent = `最终得分：${state.score} | 抓取：${state.catches}个`;
  document.getElementById('result-btn').textContent = '再来一次';
  document.getElementById('result-popup').classList.add('show');
}

// Gyroscope
function initGyroscope() {
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      if (!state.gyroEnabled || !state.gameActive) return;
      
      const gamma = e.gamma; // Left/right tilt (-90 to 90)
      const beta = e.beta;   // Front/back tilt (-180 to 180)
      
      if (gamma !== null && beta !== null) {
        state.clawX = (gamma / 45) * 1.2;
        state.clawZ = ((beta - 45) / 45) * 1.2;
        updateClaw();
      }
    });
    
    // Request permission on iOS
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.getElementById('start-btn').addEventListener('click', async () => {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          state.gyroEnabled = true;
          document.getElementById('gyro-indicator').style.display = 'flex';
        }
      });
    } else {
      state.gyroEnabled = true;
      document.getElementById('gyro-indicator').style.display = 'flex';
    }
  }
}

// Camera controls
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.controls') || e.target.closest('.game-ui > *')) return;
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  
  const deltaX = e.clientX - previousMousePosition.x;
  const deltaY = e.clientY - previousMousePosition.y;
  
  state.cameraAngle.y -= deltaX * 0.005;
  state.cameraAngle.x = Math.max(-0.5, Math.min(0.8, state.cameraAngle.x - deltaY * 0.005));
  
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mouseup', () => {
  isDragging = false;
});

// Touch camera
document.addEventListener('touchstart', (e) => {
  if (e.target.closest('.controls') || e.target.closest('.game-ui > *')) return;
  isDragging = true;
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  
  const deltaX = e.touches[0].clientX - previousMousePosition.x;
  const deltaY = e.touches[0].clientY - previousMousePosition.y;
  
  state.cameraAngle.y -= deltaX * 0.005;
  state.cameraAngle.x = Math.max(-0.5, Math.min(0.8, state.cameraAngle.x - deltaY * 0.005));
  
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

document.addEventListener('touchend', () => {
  isDragging = false;
});

// Joystick
function initJoystick() {
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  let startX = 0, startY = 0;
  
  joystick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  
  joystick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    const maxDist = 40;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const clampedDx = dist > maxDist ? (dx / dist) * maxDist : dx;
    const clampedDy = dist > maxDist ? (dy / dist) * maxDist : dy;
    
    knob.style.transform = `translate(calc(-50% + ${clampedDx}px), calc(-50% + ${clampedDy}px))`;
    
    moveClaw(clampedDx / maxDist, clampedDy / maxDist);
  });
  
  joystick.addEventListener('touchend', () => {
    knob.style.transform = 'translate(-50%, -50%)';
  });
}

// Keyboard
function initKeyboard() {
  const keys = {};
  
  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ') {
      e.preventDefault();
      dropClaw();
    }
  });
  
  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });
  
  function gameLoop() {
    if (keys['ArrowLeft'] || keys['a']) moveClaw(-1, 0);
    if (keys['ArrowRight'] || keys['d']) moveClaw(1, 0);
    if (keys['ArrowUp'] || keys['w']) moveClaw(0, -1);
    if (keys['ArrowDown'] || keys['s']) moveClaw(0, 1);
    requestAnimationFrame(gameLoop);
  }
  
  gameLoop();
}

// Event listeners
document.getElementById('grab-btn').addEventListener('click', dropClaw);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('result-btn').addEventListener('click', () => {
  document.getElementById('result-popup').classList.remove('show');
  if (state.time <= 0) startGame();
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  
  // Update camera
  const cameraDistance = 5;
  camera.position.x = Math.sin(state.cameraAngle.y) * cameraDistance;
  camera.position.y = 2 + state.cameraAngle.x * 2;
  camera.position.z = Math.cos(state.cameraAngle.y) * cameraDistance;
  camera.lookAt(0, 1, 0);
  
  // Animate toys
  toys.forEach((toy, i) => {
    if (toy.visible) {
      toy.rotation.y += delta * 0.5;
      toy.position.y = 0.4 + Math.sin(Date.now() * 0.001 + i) * 0.05;
    }
  });
  
  renderer.render(scene, camera);
}

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initialize
initThree();
initJoystick();
initKeyboard();
initGyroscope();
animate();
</script>
